const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function go(sc){
  S.sc=sc;
  document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id==='sc-'+sc));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.sc===sc));
  window.scrollTo(0,0);
}
function facBadge(k){
  const c=C[k];
  const ico=tagIcon(c.tag);
  if (c.tier<=2) return ico;          /* 기본패와 부대 카드는 세력이 없다 */
  return `<span class="fac" style="background:${FAC[c.fac].c}">${c.fac}</span>${ico}`;
}
function cardHTML(k, qty, cls='', info=false){
  const c=C[k];
  const tag = info ? 'button' : 'div';
  const attr = info ? ` data-info="${k}"` : '';
  return `<${tag} class="card ${cls} ${c.kind==='myth'?'myth':''}"${attr}
      style="border-left-color:${colorOf(k)}">
    ${facBadge(k)}
    ${qty!=null?`<span class="qty">${qty}</span>`:''}
    <span class="nm" style="color:${colorOf(k)}">${esc(c.name)}</span>
    <span class="tg">${c.tag} · ${gradeOf(k)}</span></${tag}>`;
}
function itemHTML(id, qty, cls='', ampFor=null){
  const it=IT[id];
  const amp = ampFor && isSignature(ampFor,id);
  const f = amp ? MYTH_AMP : 1;
  return `<div class="card item ${cls}" style="border-left-color:${IGRADE[it.grade]}">
    ${qty!=null?`<span class="qty">${qty}</span>`:''}
    <span class="nm" style="color:${IGRADE[it.grade]}">${esc(it.name)}</span>
    <span class="tg">${it.tag} · ${it.grade}</span>
    <span class="ef">${STATNM[it.pri]} +${Math.round(it.pa*f*100)}%${
      it.sa?` · ${STATNM[it.sec]} +${Math.round(it.sa*f*100)}%`:''}${
      it.rb?` · 발동 +${(it.rb*f).toFixed(0)}%p`:''}</span>
    ${amp?`<span class="amp">전용 증폭 ×${MYTH_AMP}</span>`:''}
    ${it.use==='myth'&&!amp?`<span class="ef" style="color:var(--bamboo-dim)">신화 조합 재료</span>`:''}</div>`;
}

/* 부족한 재료 한 줄 —— 그 재료를 무엇으로 만드는지 바로 보여준다 */
function subLine(k){
  const c=C[k];
  if (c.tier===1)
    return `<div class="sr"><span class="srk" style="color:${colorOf(k)}">${esc(c.name)}</span>
      <span class="srm">기본패 — 징집으로 얻는다</span></div>`;
  const mats=RECOF[k];
  if (!mats)
    return `<div class="sr"><span class="srk" style="color:${colorOf(k)}">${esc(c.name)}</span>
      <span class="srm">조합식 없음</span></div>`;
  const m=matCount(mats);
  const ok=canForge(k,mats);
  const ni=needItem(k);
  return `<div class="sr ${ok?'ok':''}">
    <span class="srk" style="color:${colorOf(k)}">${esc(c.name)}</span>
    <span class="srm">← ${Object.keys(m).map(x=>{
      const need=m[x],got=have(x);
      return `<em class="${got>=need?'':'lack'}">${esc(C[x].name)}${need>1?'×'+need:''}(${got})</em>`;
    }).join(' + ')}${ni?` <em class="${S.bag[ni]>0?'':'lack'}">＋${esc(IT[ni].name)}</em>`:''}</span>
    ${ok?`<button class="srb" data-out="${k}">조합</button>`:''}</div>`;
}

/* ── 징집 ── */
function rDraw(){
  if (S.over){ $('#sc-draw').innerHTML=overHTML(); return; }
  const n=DRAWS[S.day];
  let h=`<div class="lead">
      <b>${S.day===6?'결전의 날':'징집과 배급'}</b>
      <span>${S.day===6 ? '더 이상 농민을 징집하지 않는다. 명장만이 소환된다.'
        : `뽑기 ${n}장으로 기본패를 얻고, 선택권으로 상위 카드를 지정한다.`}</span>
    </div>`;

  const pickList = S.day===6
    ? (S.phase===0?[{t:6,n:1}] : S.phase===1?[{t:5,n:1}] : [{t:6,n:1},{t:4,n:2}])
    : PICKS[S.day];
  const acts=[];
  if (n>0) acts.push(`<button class="act pri" id="bDraw" ${S.drawn?'disabled':''}>
    <b>${S.drawn?'징집 완료':`기본패 ${n}장`}</b><i>8종 균등</i></button>`);
  if (pickList.length) acts.push(`<button class="act" id="bPick" ${S.picked?'disabled':''}>
    <b>${S.picked?'선택권 완료':'선택권 사용'}</b><i>${pickList.map(p=>`${TIER[p.t].n}×${p.n}`).join(' ')}</i></button>`);
  const rg=RANDOM_GRANT[S.day];
  if (rg.length) acts.push(`<button class="act rnd" id="bRand" ${S.granted?'disabled':''}>
    <b>${S.granted?'무작위 배급 완료':'무작위 배급'}</b><i>${rg.map(p=>`${TIER[p.t].n}×${p.n}`).join(' ')} 무작위</i></button>`);
  S.pendingPicks.forEach((p,i)=>acts.push(`<button class="act warn" data-rw="${i}">
    <b>${TIER[p.t].n} ×${p.n}</b><i>${esc((p.src||'보상').split(' · ')[0])}</i></button>`));
  if (acts.length) h+=`<div class="sect"><div class="actgrid">${acts.join('')}</div></div>`;

  if (S.news.length) h+=`<div class="sect"><div class="eyebrow">전황 소식</div>
    <div class="panel" style="padding:8px 11px">
    ${S.news.slice(0,5).map(n=>`<div class="nws">
      <b>${esc(n.who)}</b>가 <em style="color:${colorOf(n.unit)}">${esc(C[n.unit].name)}</em>
      <span>${gradeOf(n.unit)} 등용</span></div>`).join('')}</div></div>`;

  if (S.lastItem) h+=`<div class="sect"><div class="eyebrow">이번 페이즈 보급품</div>
    <div class="cgrid">${itemHTML(S.lastItem,null,'fresh')}</div></div>`;

  if (S.lastDraw && S.lastDraw.length){
    const t={}; S.lastDraw.forEach(k=>t[k]=(t[k]||0)+1);
    h+=`<div class="sect"><div class="eyebrow">방금 징집한 ${S.lastDraw.length}장</div>
      <div class="cgrid">${sortCards(Object.keys(t)).map(k=>cardHTML(k,t[k])).join('')}</div></div>`;
  }

  const pl=pool(), keys=poolKeys();
  const tot=Object.values(pl).reduce((a,b)=>a+b,0);
  h+=`<div class="sect"><div class="eyebrow">보유 카드 — ${tot}장 · ${myPV()} PV</div>
    ${keys.length?`<div class="cgrid">${keys.map(k=>
        cardHTML(k,pl[k],onBoard(k)?'ondeck':'',true)).join('')}</div>
      <div class="hint" style="margin-top:6px">카드를 누르면 그 카드가 쓰이는 상위 조합을 볼 수 있다.</div>`
      :`<div class="panel hint">보유 카드가 없다.</div>`}</div>`;

  /* 빈 자리에는 지금 손패로 이어지는 조합을 띄운다.
     부족한 재료마다 그 재료를 만드는 하위 조합식을 한 줄 더 붙여 다음 할 일을 보여준다. */
  const near=nearRecipes(10);
  h+=`<div class="sect"><div class="eyebrow">연관 조합 — 지금 손패에서 이어지는 길</div>
    ${near.length?near.map(r=>{
      const m=matCount(r.mats);
      const ready=r.short===0 && !r.noItem;
      const lacking=Object.keys(m).filter(k=>have(k)<m[k]);
      return `<div class="rec ${ready?'':'locked'}" style="border-left-color:${colorOf(r.out)}">
        <div class="rtop">
          <div class="out">${facBadge(r.out)}<b style="color:${colorOf(r.out)}">${esc(C[r.out].name)}</b>
            <i>${gradeOf(r.out)}${r.short?` · ${r.short}장 부족`:' · 조합 가능'}</i></div>
          <div class="mats">${Object.keys(m).map(k=>{
            const need=m[k],got=have(k);
            return `<em class="${got>=need?'':'lack'}">${tagIcon(C[k].tag,'x')}${esc(C[k].name)}${need>1?'×'+need:''}(${got})</em>`;
          }).join(' + ')}${r.noItem?` <em class="lack">＋${esc(C[r.out].need)}</em>`:''}</div>
          <button class="mk" data-out="${r.out}" ${ready?'':'disabled'}>조합</button>
        </div>
        ${lacking.length||r.noItem?`<div class="rsub">
          ${lacking.map(k=>subLine(k)).join('')}
          ${r.noItem?`<div class="sr"><span class="srk" style="color:${IGRADE['유니크']}">${esc(C[r.out].need)}</span>
            <span class="srm">유니크 보급품 — 후반 페이즈에서 지급된다</span></div>`:''}
        </div>`:''}
      </div>`;
    }).join('')
    :`<div class="panel hint">먼저 기본패를 모으자.</div>`}</div>`;

  $('#sc-draw').innerHTML=h;
  const bd=$('#bDraw'); if(bd) bd.onclick=()=>{
    const got=[]; for(let i=0;i<n;i++){ const k=pickR(BASE); give(k); got.push(k); }
    S.lastDraw=got; S.drawn=true; render();
  };
  const bp=$('#bPick'); if(bp) bp.onclick=()=>openPicker(pickList.map(capPick),()=>{S.picked=true;});
  const brd=$('#bRand'); if(brd) brd.onclick=()=>{
    const got=[];
    for (const p of RANDOM_GRANT[S.day].map(capPick))
      for (let i=0;i<p.n;i++){
        const k=pickR(byTier(p.t).filter(x=>C[x].tier<8));
        give(k); got.push(k);
      }
    S.granted=true;
    got.forEach(k=>toast(`<b style="color:${colorOf(k)}">${esc(C[k].name)}</b> 배급 · ${gradeOf(k)}`,'gain'));
    render();
  };
  $('#sc-draw').querySelectorAll('[data-rw]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.rw, p=S.pendingPicks[i];
    openPicker([capPick({t:p.t,n:p.n})],()=>{ S.pendingPicks.splice(i,1); });
  });
  $('#sc-draw').querySelectorAll('.mk,.srb').forEach(b=>b.onclick=()=>{
    if (forge(b.dataset.out, RECOF[b.dataset.out])) render();
  });
  $('#sc-draw').querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>openCardInfo(b.dataset.info));
}

/* 카드 상세 —— 한 단계 위 목록만 보여준다. 재료는 손패와 대조해 있다·없다를 바로 찍는다. */
function usedIn(k){
  return REC.filter(([o,mats])=>mats.includes(k))
    .map(([o,mats])=>({out:o, need:matCount(mats)[k], mats}));
}
function missCount(x){
  const m=matCount(RECOF[x]||[]);
  let miss=0;
  for (const q in m) miss += Math.max(0, m[q]-have(q));
  const ni=needItem(x);
  if (ni && !(S.bag[ni]>0)) miss++;
  return miss;
}
function nextUp(k){
  const t=C[k].tier, one=[], far=[];
  usedIn(k).forEach(u=>{ (C[u.out].tier===t+1 ? one : far).push(u.out); });
  one.sort((x,y)=>missCount(x)-missCount(y) || C[x].name.localeCompare(C[y].name,'ko'));
  return {one, far};
}
/* 재료 칩 —— 있으면 초록 체크, 없으면 붉은 표시 */
/* 재료 종수와 갖춘 수 —— 진행도 표시용 */
function matProgress(x){
  const m=matCount(RECOF[x]||[]), ni=needItem(x);
  let tot=0, got=0;
  for (const q in m){ tot++; if (have(q)>=m[q]) got++; }
  if (ni){ tot++; if (S.bag[ni]>0) got++; }
  return [got,tot];
}
function matLine(x){
  const m=matCount(RECOF[x]||[]), ni=needItem(x), out=[];
  Object.keys(m).forEach(q=>{
    const need=m[q], got=have(q), ok=got>=need;
    /* 재료를 누르면 그 카드가 주인공이 되는 팝업으로 넘어간다 */
    out.push(`<button class="mchip ${ok?'ok':'no'}" data-tree="${q}">${ok?'✔':'✘'} ${tagIcon(C[q].tag,'x')}${esc(C[q].name)}<b>${got}/${need}</b></button>`);
  });
  if (ni){
    const ok=S.bag[ni]>0;
    out.push(`<span class="mchip ${ok?'ok':'no'}">${ok?'✔':'✘'} ◆${esc(IT[ni].name)}<b>${S.bag[ni]||0}/1</b></span>`);
  }
  return out.join('');
}
function upCard(x){
  const c=C[x], ok=canForge(x, RECOF[x]), n=pool()[x]||0;
  return `<div class="upc ${ok?'can':''}" style="border-left-color:${TIER[c.tier].c}">
    <div class="uph">
      <button class="upn" data-tree="${x}" style="color:${TIER[c.tier].c}"
        >${tagIcon(c.tag,'x')}${esc(c.name)}${c.kind==='myth'?'★':''}</button>
      ${n?`<span class="upq">${n}장</span>`:''}
      <span class="upb ${ok?'y':'n'}">${ok?'가능':'부족 '+missCount(x)}</span>
    </div>
    <div class="upm">${matLine(x)}</div>
    ${ok?`<button class="upmk" data-mk="${x}">조합</button>`:''}</div>`;
}
function openCardInfo(k){
  const c=C[k], pl=pool(), own=RECOF[k];
  const {one, far}=nextUp(k);
  const canN=one.filter(x=>canForge(x,RECOF[x])).length;

  let h=`<h3>${c.tier>2?`<span class="fac" style="position:static;border-radius:3px;padding:2px 5px;
      background:${FAC[c.fac].c}">${c.fac}</span>`:''}${tagIcon(c.tag,'hd')}
    <span style="color:${TIER[c.tier].c}">${esc(c.name)}</span></h3>
    <div class="sub">${c.tag} · ${TIER[c.tier].n} · ${c.pv} PV · ${c.tr.toLocaleString()}명 ·
      <b style="color:${pl[k]?'var(--jade)':'var(--seal)'}">보유 ${pl[k]||0}장</b></div>
    <div class="panel" style="margin-bottom:12px">
      <div class="statrow">
        <div><b>${c.atk}</b><span>공격</span></div>
        <div><b>${c.def}</b><span>방어</span></div>
        ${c.int?`<div><b>${c.int}</b><span>책략</span></div>`:''}
        <div><b>${c.res}</b><span>책방</span></div>
        <div><b>${c.spd}</b><span>속도</span></div>
      </div>
      ${c.sk?`<div class="skbox">
        <b>『${esc(c.sk.n)}』<em>${skillRole(c)} · 발동 ${Math.round(RATE[c.tier]*100)}%</em></b>
        <span>${esc(skillDesc(c))}</span>
        ${c.sk.psv?`<i>패시브 「${esc(psvName(c.sk.psv))}」 ${esc(psvDesc(c.sk.psv))}</i>`:''}
        </div>`:''}
      <div class="hint" style="margin-top:7px">
        ${AFF[c.tag].why} —
        <b style="color:var(--jade)">선호 ${affZones(c.tag,'pref')}</b> ${affDesc(c.tag,'pref')} ·
        <b style="color:var(--seal)">어색 ${affZones(c.tag,'bad')}</b> ${affDesc(c.tag,'bad')}</div>
    </div>`;

  /* 타겟 유닛의 조합법 —— 등급과 무관하게 가장 먼저 보여준다.
     부족한 재료를 눌러 들어온 사람이 알고 싶은 건 바로 이것이다. */
  if (own){
    const [g,tt]=matProgress(k), ok=canForge(k,own);
    h+=`<div class="eyebrow">이 카드를 만드는 법 — 재료 ${g}/${tt}${ok?' · 지금 조합 가능':''}</div>
      <div class="upc ${ok?'can':''}" style="border-left-color:${TIER[c.tier].c};margin-bottom:14px">
        <div class="upm">${matLine(k)}</div>
        <button class="upmk ${ok?'':'off'}" data-mk="${k}" ${ok?'':'disabled'}>${ok?'조합':`재료 ${tt-g}종 부족`}</button>
      </div>`;
  } else {
    h+=`<div class="eyebrow">이 카드를 만드는 법</div>
      <div class="panel hint" style="margin-bottom:14px">기본패 — 조합할 수 없고 징집으로만 얻는다.</div>`;
  }

  h+=`<div class="eyebrow">한 단계 위 · ${TIER[Math.min(8,c.tier+1)].n} ${one.length}종${
    canN?` — <b style="color:var(--jade)">${canN}종 지금 조합 가능</b>`:''}</div>`;
  h+= one.length ? `<div class="upgrid">${one.map(upCard).join('')}</div>`
    : `<div class="panel hint">${c.tier===8
        ? '최종 등급이라 위가 없다. 그대로 편성한다.'
        : `이 카드를 재료로 쓰는 ${TIER[c.tier+1].n} 조합이 없다 — 편성 전용이다.`}</div>`;
  if (far.length){
    const g={}; far.forEach(x=>{ g[C[x].tier]=(g[C[x].tier]||0)+1; });
    h+=`<div class="hint" style="margin-top:7px">그 밖에 ${
      Object.entries(g).map(([t,n])=>`${TIER[t].n} ${n}종`).join(' · ')}에도 재료로 쓰인다.</div>`;
  }
  if (!one.length && c.tier<8){
    /* 막다른 카드라면 같은 병종의 상위 등급을 대신 안내한다 */
    const alt=byTierTag(c.tier+1, c.tag);
    if (alt.length) h+=`<div class="hint" style="margin-top:7px">
      같은 ${c.tag} ${TIER[c.tier+1].n}: ${alt.map(x=>
        `<b data-tree="${x}" style="color:${TIER[c.tier+1].c};cursor:pointer">${esc(C[x].name)}</b>`
      ).join(' · ')}</div>`;
  }


  openSheet(h);
  $('#sheet').querySelectorAll('[data-tree]').forEach(b=>b.onclick=()=>{
    if (b.dataset.tree!==k) openCardInfo(b.dataset.tree);
  });
  $('#sheet').querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.mk;
    if (forge(t, RECOF[t])){
      toast(`<b style="color:${TIER[C[t].tier].c}">${esc(C[t].name)}</b> 조합 완료`,'gain');
      render(); openCardInfo(k);
    }
  });
}

/* ── 조합 (전체 목록 + 필터) ── */
function rForge(){
  const f=S.fTag;
  let h=`<div class="sect"><div class="eyebrow">조합 — 전체 ${REC.length}개</div>
    <div class="chips">
      <button class="chip ${!f?'on':''}" data-t="">전체</button>
      ${TAGORDER.map(t=>`<button class="chip ${f===t?'on':''}" data-t="${t}">${t}</button>`).join('')}
    </div>
    <div class="hint" style="margin-top:6px">편성판 카드도 재료로 쓰인다. 신화 장수는 유니크 아이템이 함께 필요하다.</div></div>`;
  for (let t=8;t>=2;t--){
    let list=REC.filter(r=>C[r[0]].tier===t);
    if (f) list=list.filter(r=>C[r[0]].tag===f);
    if (!list.length) continue;
    h+=`<div class="sect"><div class="eyebrow">
      <span class="tierdot" style="background:${TIER[t].c}"></span>${TIER[t].n} · ${PVRANGE[t]} PV · ${list.length}종</div>`;
    for (const [out,mats] of list){
      const ok=canForge(out,mats), m=matCount(mats), ni=needItem(out);
      h+=`<div class="rec ${ok?'':'locked'}" style="border-left-color:${colorOf(out)}">
        <div class="rtop">
        <div class="out">${facBadge(out)}<b style="color:${colorOf(out)}">${esc(C[out].name)}</b>
          <i>${C[out].tag} · ${C[out].pv} PV</i></div>
        <div class="mats">${Object.keys(m).map(k=>{
          const need=m[k],got=have(k);
          return `<em class="${got>=need?'':'lack'}">${tagIcon(C[k].tag,'x')}${esc(C[k].name)}${need>1?'×'+need:''}(${got})</em>`;
        }).join(' + ')}${ni?` <em class="${S.bag[ni]>0?'':'lack'}">＋${esc(IT[ni].name)}(${S.bag[ni]||0})</em>`:''}</div>
        <button class="mk" data-out="${out}" ${ok?'':'disabled'}>조합</button></div>
        ${C[out].sk?`<div class="rsk">『${esc(C[out].sk.n)}』
          <em>${skillRole(C[out])} · ${Math.round(RATE[C[out].tier]*100)}%</em>
          ${esc(skillDesc(C[out]))}${C[out].sk.psv?` · 패시브 ${esc(PSVNM[C[out].sk.psv]||'')}`:''}</div>`:''}
        </div>`;
    }
    h+=`</div>`;
  }
  /* 보유 스킬 —— 지금 손패·편성판에 있는 카드의 능력을 한눈에 */
  const owned=poolKeys().filter(k=>C[k].sk);
  h+=`<div class="sect"><div class="eyebrow">보유 스킬 — ${owned.length}종</div>
    ${owned.length?`<div class="panel" style="padding:9px 11px">
      ${owned.map(k=>{
        const c=C[k];
        return `<div class="skrow">
          <span class="skn" style="color:${colorOf(k)}">${esc(c.name)}</span>
          <span class="skb">
            <b>『${esc(c.sk.n)}』<em>${skillRole(c)} · 발동 ${Math.round(RATE[c.tier]*100)}%</em></b>
            <span>${esc(skillDesc(c))}</span>
            ${c.sk.psv?`<i>「${esc(psvName(c.sk.psv))}」 ${esc(psvDesc(c.sk.psv))}</i>`:''}
          </span></div>`;
      }).join('')}</div>`
      :`<div class="panel hint">희귀 등급부터 스킬을 가진다. 아직 보유한 스킬이 없다.</div>`}</div>`;

  const tradable=[2,3,4,5,6,7].filter(t=>tierTotal(t)>0);
  const pl=pool();
  h+=`<div class="sect"><div class="eyebrow">환전 — 이번 페이즈 ${S.trades}회 남음</div>
    <div class="panel"><div class="hint" style="margin-bottom:10px">
      같은 등급 안에서 1대1로 바꾼다. 계보를 갈아타는 유일한 통로다.</div>
    ${!tradable.length?'<div class="hint">바꿀 카드가 없다.</div>'
      :(S.trades<=0?'<div class="hint">이번 페이즈 환전을 모두 썼다.</div>'
      :`<div class="cgrid">${tradable.flatMap(t=>Object.keys(tierStock(t)).map(k=>
          `<button class="card" data-tr="${k}" style="border-left-color:${colorOf(k)}">
            ${facBadge(k)}<span class="qty">${pl[k]}</span>
            <span class="nm" style="color:${colorOf(k)}">${esc(C[k].name)}</span>
            <span class="tg">${C[k].tag} · 바꾸기</span></button>`)).join('')}</div>`)}
    </div></div>`;
  $('#sc-forge').innerHTML=h;
  $('#sc-forge').querySelectorAll('.chip[data-t]').forEach(b=>b.onclick=()=>{
    S.fTag=b.dataset.t||null; rForge();
  });
  $('#sc-forge').querySelectorAll('.mk').forEach(b=>b.onclick=()=>{
    if (forge(b.dataset.out, RECOF[b.dataset.out])) render();
  });
  $('#sc-forge').querySelectorAll('.card[data-tr]').forEach(b=>b.onclick=()=>openTrade(b.dataset.tr));
}
function openTrade(from){
  const t=C[from].tier;
  let h=`<h3>${esc(C[from].name)} 환전</h3>
    <div class="sub">같은 ${TIER[t].n} 등급 안에서 바꾼다 — 남은 횟수 ${S.trades}회</div>`;
  for (const tag of TAGORDER){
    const ks=byTierTag(t,tag).filter(k=>k!==from);
    if (!ks.length) continue;
    h+=`<div class="eyebrow" style="margin:11px 0 5px">${tag}</div>
      <div class="cgrid">${ks.map(k=>`<button class="card" data-w="${k}" style="border-left-color:${colorOf(k)}">

        <span class="tg">공${C[k].atk} 방${C[k].def}${C[k].int?' 책'+C[k].int:''}</span></button>`).join('')}</div>`;
  }
  openSheet(h);
  $('#sheet').querySelectorAll('.card[data-w]').forEach(b=>b.onclick=()=>{

}

/* ── 전장 ── */
function stageHTML(r){
  const chip=u=>{
    const col = u.kind==='myth' ? '#ffd76e' : TIER[u.tier].c;
    return `<div class="uc" data-k="${u.key}">
      ${u.tier>2?`<span class="fac" style="background:${FAC[u.fac].c}">${u.fac}</span>`:''}
      ${tagIcon(u.tag)}
      <span class="un" style="color:${col}">${esc(u.name)}</span>
      <span class="ut">${u.tag}${u.item?' ◆':''}</span>
      <div class="bar"><i style="width:100%"></i></div>
      <div class="bar m"><i style="width:50%"></i></div></div>`;
  };
  const rows=(side,form,rev)=>{
    const f=FORM[form];
    const order=rev?[3,2,1,0]:[0,1,2,3];
    return order.map(ri=>{
      const cells=f.grid[ri].map(si=>{
        if (si===null) return `<div class="uc void"></div>`;
        const u=r.roster.find(x=>x.camp===side && x.key===side+si);
        return u?chip(u):`<div class="uc void"></div>`;
      }).join('');
      return `<div class="brow"><span class="blbl ${side==='B'?'foe':''}">${LINES[ri]}</span>
        <div class="bcells">${cells}</div></div>`;
    }).join('');
  };
  const synTxt=s=>s.list.length?s.list.map(x=>`${x.fac}${x.n}`).join(' '):'없음';
  return `<div class="stage">
    <div class="bhead foe"><b>${r.foe?esc(r.foe):'적 진영'}${
        r.foeBot?'<span class="botid">BOT</span>':''}</b>
      <span>${r.foeBot?`${esc(r.foeBot.epi)} · ${r.foeBot.pv>0?`${r.foeBot.pv} PV · `:''}`:''}${
        FORM[r.bForm].n} · ${FORM[r.bForm].sil} · 시너지 ${synTxt(r.bSyn)}</span></div>
    ${rows('B',r.bForm,true)}
    <div class="midrule"><span></span><b>접 전 면</b><span></span></div>
    ${rows('A',r.aForm,false)}
    <div class="bhead"><b>내 진영</b><span>${FORM[r.aForm].n} · ${FORM[r.aForm].sil} · 시너지 ${synTxt(r.aSyn)}</span></div>
    </div>`;
}
function applySnap(r,snap){
  r.roster.forEach((u,i)=>{
    const el=document.querySelector(`.uc[data-k="${u.key}"]`); if(!el) return;
    const [tr,mo,al]=snap[i];
    const bars=el.querySelectorAll('.bar i'); if(bars.length<2) return;
    const tp=Math.max(0,Math.min(100,tr/u.max*100)), mp=Math.max(0,Math.min(100,mo/200*100));
    bars[0].style.width=tp+'%'; bars[0].parentNode.className='bar'+(tp<=25?' lo':'');
    bars[1].style.width=mp+'%'; bars[1].parentNode.className='bar m'+(mo<=30?' lo':'');
    el.classList.toggle('gone',!al);
  });
}
function focusChip(key,cls){
  document.querySelectorAll('.uc.act,.uc.hurt').forEach(e=>e.classList.remove('act','hurt'));
  if(!key) return;
  const el=document.querySelector(`.uc[data-k="${key}"]`);
  if(el) el.classList.add(cls==='sk'||cls==='hl'?'act':'hurt');
}
/* 출진하면 적 진영이 화면 맨 윗줄에 걸리도록 스크롤을 옮긴다.
   상단 헤더가 sticky라 그 높이만큼 덜어내야 적 진영 머리가 가려지지 않는다.
   go()가 스크롤을 0으로 되돌린 뒤에 실행되어야 해서 한 프레임 미룬다. */
function focusFoeLine(){
  if (typeof window==='undefined' || typeof window.requestAnimationFrame!=='function') return;
  window.requestAnimationFrame(()=>{
    const st=document.querySelector('#sc-battle .stage'); if(!st) return;
    const hd=document.querySelector('header');
    const off=(hd?hd.offsetHeight:0)+6;
    const cur=window.pageYOffset||document.documentElement.scrollTop||0;
    const top=Math.max(0, Math.round(st.getBoundingClientRect().top+cur-off));
    try { window.scrollTo({top, behavior:'smooth'}); }
    catch(e){ window.scrollTo(0, top); }
  });
}
function stopPlay(){ if(PB&&PB.timer){ clearInterval(PB.timer); PB.timer=null; } }
const evHTML=e=>e.c==='div'?(e.t?`<hr><p class="div">${esc(e.t)}</p>`:'<hr>')
  :`<p class="${e.c}">${esc(e.t)}</p>`;
function startPlay(r){
  stopPlay();
  const feed=$('#feed'); if(!feed) return;
  feed.innerHTML=''; PB={i:0,done:false,timer:null};
  const step=()=>{
    if (PB.i>=r.ev.length){ finishPlay(r); return; }
    const e=r.ev[PB.i++];
    applySnap(r,e.s); focusChip(e.f,e.c);
    feed.insertAdjacentHTML('beforeend',evHTML(e));
    feed.scrollTop=feed.scrollHeight;
  };
  PB.timer=setInterval(step,260); step();
}
/* 결과 삽화 —— 토벌은 황건적 그림, 대전·토너먼트는 세력전 그림.
   무승부는 이길 것도 진 것도 아니라 그림 없이 간다. */
const ART = (typeof window!=='undefined' && window.BATTLE_ART) || {};
const ART_CAP = {
  win1:'적장을 무릎 꿇렸다', win2:'전열을 밀어붙였다',
  lose1:'토벌에 실패했다',   lose2:'진영이 무너졌다'
};
function battleArt(r){
  if (r.draw) return null;
  const key = (r.win?'win':'lose') + (r.kind==='quest' ? '1' : '2');
  return ART[key] ? {key, ...ART[key]} : null;
}
/* 수훈갑 —— 전투가 끝나면 으뜸 공을 세운 유닛을 알린다 */
function openMerit(r){
  const m=r.mvp;
  const art=battleArt(r);
  if (!m && !art){ return; }              /* 공도 그림도 없으면 띄울 것이 없다 */
  const line = x => x ? `<div class="mrt"><span>${x[0]}</span><b>${x[1]}</b></div>` : '';
  let h=`<h3>${m?'수훈갑':(r.win?'승전':'패전')}</h3>
    <div class="sub">${esc(r.title)} · ${r.turns}턴 —
    ${r.draw?'무승부':(r.win?'승리':'패배')}</div>`;
  if (art)
    h+=`<figure class="bart ${r.win?'w':'l'}">
      <img src="${art.uri}" alt="" width="${art.w}" height="${art.h}" decoding="async">
      <figcaption>${ART_CAP[art.key]}</figcaption></figure>`;
  if (m)
  h+=`<div class="meritcard ${m.alive?'':'fell'}" style="border-left-color:${TIER[m.tier].c}">
      <div class="mh">
        ${m.tier>2?`<span class="fac" style="position:static;border-radius:3px;padding:2px 5px;
          background:${FAC[m.fac].c}">${m.fac}</span>`:''}${tagIcon(m.tag,'hd')}
        <b style="color:${TIER[m.tier].c}">${esc(m.name)}${m.kind==='myth'?'★':''}</b>
        <span>${posName(m.line, FORM[r.aForm].slots[m.slot]?FORM[r.aForm].slots[m.slot].col:1)}</span>
      </div>
      <div class="mrts">
        ${m.dmg?line(['입힌 병력 피해', m.dmg.toLocaleString()]):''}
        ${m.mdmg?line(['꺾은 사기', m.mdmg.toLocaleString()]):''}
        ${m.kills?line(['이탈시킨 적', m.kills+'칸']):''}
        ${m.heal?line(['되살린 사기', m.heal.toLocaleString()]):''}
        ${line(['남은 병력', m.alive?`${m.left.toLocaleString()} / ${m.max.toLocaleString()}`:'무너짐'])}
        ${m.item?line(['장비', IT[m.item].name]):''}
      </div>
    </div>`;
  if (m && r.ranked.length>1){
    h+=`<div class="eyebrow" style="margin-top:13px">그다음 공</div>
      ${r.ranked.slice(1).map((x,i)=>`<div class="mrow2">
        <span class="rk">${i+2}</span>${tagIcon(x.tag,'x')}
        <b style="color:${TIER[x.tier].c}">${esc(x.name)}</b>
        <span>${[x.dmg?`병력 ${x.dmg.toLocaleString()}`:'',
                 x.mdmg?`사기 ${x.mdmg.toLocaleString()}`:'',
                 x.kills?`이탈 ${x.kills}`:'',
                 x.heal?`회복 ${x.heal.toLocaleString()}`:''].filter(Boolean).join(' · ')}</span>
      </div>`).join('')}`;
  }
  if (S.lastSpoil) h+=`<div class="hint" style="margin-top:11px;text-align:center">
    노획 — 기본패 <b style="color:var(--bamboo)">${S.lastSpoil.n}장</b></div>`;
  h+=`<button class="btn pri" id="mrtClose" style="margin-top:14px">확인</button>`;
  openSheet(h);
  const b=$('#mrtClose'); if(b) b.onclick=closeSheet;
}
function finishPlay(r){
  stopPlay(); if(PB) PB.done=true;
  const feed=$('#feed');
  if (feed){
    if (r.ev.length) applySnap(r,r.ev[r.ev.length-1].s);
    focusChip(null);
    feed.insertAdjacentHTML('beforeend',
      `<div class="verdict ${r.win?'w':'l'}">${r.draw?'무승부':(r.win?'승리':'패배')} — 잔존 ${r.left}칸 대 ${r.eLeft}칸</div>`);
    feed.scrollTop=feed.scrollHeight;
  }
  render();
  openMerit(r);
}
function skipPlay(r){
  stopPlay();
  const feed=$('#feed');
  if (feed) feed.innerHTML=r.ev.map(e=>evHTML(e).replace('<p class=','<p style="animation:none;opacity:1" class=')).join('');
  PB={i:r.ev.length,done:false,timer:null}; finishPlay(r);
}
function bracketHTML(){
  const t=S.tour;
  return `<div class="sect"><div class="eyebrow">대진표 — ${ROUNDNM[t.round]} 진행 중</div>
    <div class="panel" style="padding:10px 11px">
    ${t.res.map((ms,r)=>!ms?'':`<div class="brk"><span class="brkr">${ROUNDNM[r]}</span>
      <div class="brkm">${ms.map((m,i)=>{
        const cur=r===t.round&&i===t.myMatch&&!m.w;
        const nm=pl=>`<em class="${m.w&&m.w.name===pl.name?'win':''} ${pl.me?'me':''}">${esc(pl.name)}</em>`;
        return `<span class="brkp ${cur?'now':''}">${nm(m.a)}<i>대</i>${nm(m.b)}</span>`;
      }).join('')}</div></div>`).join('')}
    <div class="hint" style="margin-top:8px">전력 순위로 시딩한다. 다른 대진도 같은 전투 엔진으로 진행된다.</div>
    </div></div>`;
}
function rBattle(){
  if (S.over){ stopPlay(); $('#sc-battle').innerHTML=overHTML(); return; }
  const placed=S.board.filter(Boolean).length;
  const isTour=S.day===6&&S.phase===2;
  if (isTour&&!S.tour) initTour();
  let h='';
  if (isTour){
    const m=S.tour.res[S.tour.round][S.tour.myMatch];
    const foe=m.a.me?m.b:m.a;
    h+=`<div class="sect"><div class="eyebrow">최종 토너먼트</div><div class="panel">
      <div class="ttl">${ROUNDNM[S.tour.round]} — ${esc(foe.name)}</div>
      <div class="hint">지면 그대로 끝난다. 상대 ${foe.pv} PV · 내 전력 ${myPV()} PV</div></div></div>`;
    h+=bracketHTML();
    if (!S.log) h+=`<div class="sect"><button class="btn warn" id="bTour" ${placed?'':'disabled'}>
      ${placed?'출진':'편성이 비어 있다'}<small>${placed}/9칸 · ${boardPower().toLocaleString()}명</small></button></div>`;
  } else {
    /* 페이즈마다 토벌 1회 + 대전 1회 */
    h+=`<div class="sect"><div class="eyebrow">${DAYNAME[S.day]}요일 ${PHASE_N[S.phase]}</div>
      <div class="panel"><div class="ttl">이 페이즈의 두 전투</div>
      <div class="hint">토벌과 임의 세력 대전을 각각 한 번 치른다.
      <b style="color:var(--seal)">토벌 실패는 어느 페이즈든 경고로 쌓인다</b> —
      현재 ${S.strikes}/${STRIKE_MAX}회.</div></div></div>`;
    /* 두 전투는 반드시 순서대로 하나씩. 재생 중에는 둘 다 잠근다. */
    const playing = !!(PB && !PB.done);
    h+=`<div class="sect"><button class="btn ${S.questDone?'':'warn'}" id="bQuest"
        ${S.questDone||!placed||playing?'disabled':''}>
      ${S.questDone?'① 토벌 완료':`① 토벌 — ${QUESTS[S.day][S.phase]}`}
      <small>${S.questDone?`다음은 대전이다`
        :`적 전력 ${QPV[S.day][S.phase]} PV · 승리 시 기본패 ${QUEST_BASE[S.day]}장 · 실패 시 경고`
      }</small></button></div>`;
    h+=`<div class="sect"><button class="btn ${S.pvpDone?'':(S.questDone?'pri':'')}" id="bPvp"
        ${S.pvpDone||!placed||playing||!S.questDone?'disabled':''}>
      ${S.pvpDone?'② 대전 완료':'② 대전 — 임의 세력'}
      <small>${!S.questDone?'토벌을 먼저 끝내야 열린다'
        :`승리 시 기본패 ${PVP_BASE.win}장 · 패배해도 ${PVP_BASE.lose}장`}</small></button></div>`;
  }

  if (S.log){
    const r=S.log;
    h+=`<div class="sect">${stageHTML(r)}</div>`;
    h+=`<div class="sect"><div class="eyebrow">${esc(r.title)} · ${r.turns}턴</div>
      <div class="feed" id="feed"></div></div>`;
    if (PB&&!PB.done) h+=`<div class="sect"><button class="btn ghost" id="bSkip">끝까지 건너뛰기</button></div>`;
    else if (S.tour&&S.tour.next)
      h+=`<div class="sect"><button class="btn pri" id="bRound">${ROUNDNM[S.tour.round+1]} 진출</button></div>`;
    else if (!isTour&&S.questDone&&S.pvpDone)
      h+=`<div class="sect"><button class="btn pri" id="bNext">다음 페이즈로<small>${
        S.phase===2?`${DAYNAME[Math.min(6,S.day+1)]}요일 오전`:PHASE_N[S.phase+1]}</small></button></div>`;
  }
  $('#sc-battle').innerHTML=h;
  const bq=$('#bQuest'); if(bq) bq.onclick=doQuest;
  const bv=$('#bPvp');   if(bv) bv.onclick=doPvp;
  const bt=$('#bTour');  if(bt) bt.onclick=doTour;
  const bs=$('#bSkip');  if(bs) bs.onclick=()=>skipPlay(S.log);
  const bn=$('#bNext');  if(bn) bn.onclick=()=>{ advance(); go('draw'); };
  const brd=$('#bRound');if(brd) brd.onclick=tourAdvance;
  if (S.log){
    if (PB&&PB.fresh){
      PB.fresh=false; startPlay(S.log);
      focusFoeLine();
    }
    else if (PB&&PB.done){
      const feed=$('#feed');
      if (feed){
        feed.innerHTML=S.log.ev.map(e=>evHTML(e).replace('<p class=','<p style="animation:none;opacity:1" class=')).join('')
          +`<div class="verdict ${S.log.win?'w':'l'}" style="animation:none;opacity:1">${
            S.log.draw?'무승부':(S.log.win?'승리':'패배')} — 잔존 ${S.log.left}칸 대 ${S.log.eLeft}칸</div>`;
        if (S.log.ev.length) applySnap(S.log,S.log.ev[S.log.ev.length-1].s);
      }
    }
  }
}

/* 신화 조합을 재료 등급 구성으로 묶어 경로를 보여준다 */
function mythPaths(){
  const g={};
  byTier(8).forEach(k=>{
    const key=RECOF[k].map(x=>C[x].tier).sort((p,q)=>q-p).join(',');
    (g[key]=g[key]||[]).push(k);
  });
  return Object.entries(g).sort((x,y)=>y[1].length-x[1].length)
    .map(([key,ks])=>({label:key.split(',').map(t=>TIER[+t].n).join(' + '), ks}));
}
function rLine(){
  const pl=pool();
  const owned=t=>byTier(t).filter(k=>pl[k]).length;

  /* 등급 범례 —— PV가 카드마다 다르므로 범위를 함께 보여준다 */
  let h=`<div class="sect"><div class="eyebrow">등급</div>
    <div class="panel" style="padding:9px 11px">
    <table class="grd"><tr><th>등급</th><th>PV</th><th>병력</th><th>종수</th><th>보유</th></tr>
    ${TIERS.map(t=>`<tr>
      <td><span class="tierdot" style="background:${TIER[t].c}"></span>
        <b style="color:${TIER[t].c}">${TIER[t].n}</b></td>
      <td>${PVRANGE[t]}</td><td>${TIER[t].tr.toLocaleString()}</td>
      <td>${byTier(t).length}</td>
      <td class="${owned(t)?'has':''}">${owned(t)||'—'}</td></tr>`).join('')}
    </table></div></div>`;

  /* 계보 진행도 —— 게이지 위에 등급 머리글을 달아 어디까지 왔는지 읽히게 */
  h+=`<div class="sect"><div class="eyebrow">계보 진행도</div>
    <div class="panel" style="padding:11px 12px">
    <div class="lg lghd"><span class="lgt"></span>
      <span class="lgp">${TIERS.map(t=>`<i class="hd" style="color:${TIER[t].c}">${TIER[t].n[0]}</i>`).join('')}</span>
      <span class="lgn" style="font-family:var(--body);font-weight:400;font-size:9px">최고 보유</span></div>
    ${TAGORDER.map(tag=>{
      const own=Object.keys(pl).filter(k=>C[k].tag===tag);
      const top=own.length?Math.max(...own.map(k=>C[k].tier)):0;
      const best=own.filter(k=>C[k].tier===top).sort((x,y)=>pl[y]-pl[x])[0];
      const n=own.reduce((x,k)=>x+pl[k],0);
      return `<div class="lg"><span class="lgt">${tagIcon(tag,'x')}${tag}</span>
        <span class="lgp">${TIERS.map(t=>
          `<i class="${t<=top?'on':''}" style="${t<=top?`background:${TIER[t].c};border-color:transparent`:''}"></i>`).join('')}</span>
        <span class="lgn">${best?esc(C[best].name):'—'}<small>${n?n+'장':'없음'}</small></span></div>`;
    }).join('')}
    <div class="hint" style="margin-top:9px">가로 여덟 칸이 기본부터 신화까지다.
    칸이 비어 있으면 그 등급에 아직 도달하지 못했다는 뜻이다.</div>
    </div></div>`;

  /* 병종별 계보 —— 카드마다 스킬명과 PV를 붙인다 */
  for (const tag of TAGORDER){
    const cnt=[6,7,8].map(t=>byTierTag(t,tag).length);
    h+=`<div class="sect"><div class="eyebrow">${tagIcon(tag,'x')} ${tag} 계보
      <span style="color:var(--bamboo-dim)"> · 초월 ${cnt[0]} 불멸 ${cnt[1]} 신화 ${cnt[2]}</span></div>
      <div class="panel" style="padding:9px 11px">`;
    for (let t=8;t>=1;t--){
      const ks=byTierTag(t,tag);
      if (!ks.length) continue;
      h+=`<div class="lrow"><span class="lrt" style="color:${TIER[t].c}">${TIER[t].n}</span>
        <span class="lrn">${ks.map(k=>{
          const c=C[k], has=(pl[k]||0)>0;
          return `<em class="${has?'own':''}" data-info="${k}"
            style="${has?`color:${TIER[t].c};border-color:${TIER[t].c}66`:''}"
            >${esc(c.name)}${c.kind==='myth'?'★':''}${has?`<b>${pl[k]}</b>`:''}
            <u>${c.sk?esc(c.sk.n)+' · ':''}${c.pv} PV</u></em>`;
        }).join('')}</span></div>`;
    }
    h+=`</div></div>`;
  }

  /* 신화 —— 경로가 셋이라 묶어서 보여준다 */
  const paths=mythPaths();
  h+=`<div class="sect"><div class="eyebrow">신화 ${byTier(8).length}종 — 경로 ${paths.length}갈래</div>
    <div class="panel hint" style="margin-bottom:8px">
      모든 신화는 유니크 아이템을 함께 소모하며, 그 아이템은 완성된 장수에게 영구히 장착된다.
      불멸을 거치지 않는 경로도 있다.</div>
    ${paths.map(p=>`<div class="mpath">
      <div class="mph">${esc(p.label)} <span>${p.ks.length}종</span></div>
      ${p.ks.map(k=>{
        const c=C[k], ni=ITEM_BY_NAME[c.need], has=(pl[k]||0)>0;
        const m=matCount(RECOF[k]);
        return `<div class="mrow ${has?'own':''}" data-info="${k}">
          <span class="mn" style="color:${TIER[8].c}">${esc(c.name)}</span>
          <span class="mt">${c.tag} · ${c.pv} PV</span>
          <span class="mm">${Object.keys(m).map(x=>{
            const need=m[x], got=have(x);
            return `<em class="${got>=need?'ok':''}">${esc(C[x].name)}${need>1?'×'+need:''}</em>`;
          }).join(' + ')}</span>
          <span class="mi" style="color:${S.bag[ni]>0?IGRADE['유니크']:'var(--seal)'}">
            ◆ ${esc(c.need)} ${S.bag[ni]||0}개</span></div>`;
      }).join('')}
    </div>`).join('')}</div>`;

  $('#sc-line').innerHTML=h;
  $('#sc-line').querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>openCardInfo(b.dataset.info));
}

/* ── 순위 ── */
function standHTML(){
  const dead=!!(S.over&&!S.over.win);
  const rows=[{name:'나',epi:`${S.myW}승 ${S.myL}패${S.strikes?` · 경고 ${S.strikes}`:''}`,
               fac:'촉', pv:myPV(), me:1, dead}]
    .concat(S.bots.map(b=>({name:b.name,epi:b.epi,fac:b.fac,pv:Math.round(b.pv),dead:false})));
  rows.sort((a,b)=>b.pv-a.pv);
  return rows.map((r,i)=>`<div class="st-row ${r.me?'me':''} ${r.dead?'out':''}">
    <span class="rk">${i+1}</span>
    <span class="fac" style="background:${FAC[r.fac].c}">${r.fac}</span>
    <span class="nm">${esc(r.name)}<small>${esc(r.epi)}</small></span>
    <span class="pw">${r.dead?'멸망':r.pv+' PV'}</span></div>`).join('');
}

    <div class="panel"><div class="statrow">
      <div><b style="font-size:24px">${my}위</b><span>8인 중</span></div>
      <div><b>${myPV()}</b><span>내 전력</span></div>
      <div><b>${S.myW}승 ${S.myL}패</b><span>전적</span></div>
    </div></div></div>`;
  h+=`<div class="sect">${standHTML()}</div>`;
  h+=`<div class="sect"><div class="eyebrow">세력 성향</div><div class="panel">
    ${S.bots.slice().sort((a,b)=>b.pv-a.pv).map(b=>`<div class="lg">
      <span class="fac" style="background:${FAC[b.fac].c}">${b.fac}</span>

      <span class="pw">${Math.round(b.pv)}</span></div>`).join('')}</div></div>`;
  h+=`<div class="sect"><div class="eyebrow">경고</div><div class="panel">
    <div style="display:flex;gap:6px;align-items:center">
      ${Array.from({length:STRIKE_MAX},(_,i)=>`<span class="strike ${i<S.strikes?'on':''}"></span>`).join('')}
      <span class="hint" style="margin-left:6px">토벌 실패 ${S.strikes} / ${STRIKE_MAX}</span></div>
    <div class="hint" style="margin-top:8px">모든 토벌 실패가 경고로 쌓이며, 3일차부터 한도에 닿으면 멸망한다. 봇 세력은 멸망하지 않고 전력 손실로만 대가를 치른다.</div>
    </div></div>`;
  $('#sc-rank').innerHTML=h;
}

const KDEF=Object.assign({},K);
let simOut=null;
function simBoards(){
  const p=byTier(7).filter(k=>PHYS_TAGS.includes(C[k].tag));
  const q=byTier(7).filter(k=>INT_TAGS.includes(C[k].tag));
  const s6=byTier(6);
  const ph=p.slice(0,3).concat(s6.filter(k=>PHYS_TAGS.includes(C[k].tag)).slice(0,6));
  const it=q.slice(0,3).concat(s6.filter(k=>INT_TAGS.includes(C[k].tag)).slice(0,6));
  const mx=p.slice(0,2).concat(q.slice(0,2)).concat(s6.slice(0,5));
  return {'물리':ph,'지략':it,'혼합':mx};
}
function runSim(n){
  const B=simBoards(), ks=Object.keys(B), rows=[];
  const FM={'물리':'hagik','지략':'bangwon','혼합':'eorin'};
  for (let i=0;i<ks.length;i++) for (let j=i+1;j<ks.length;j++){
    let w=0,tt=0,cp=0;
    for (let t=0;t<n;t++){
      const r=runBattle(autoPlace(B[ks[i]],FM[ks[i]]),FM[ks[i]],115,null,
                        autoPlace(B[ks[j]],FM[ks[j]]),FM[ks[j]],115,null,'sim');
      if(r.win)w++; tt+=r.turns; if(r.turns>=K.cap)cp++;
    }
    rows.push({a:ks[i],b:ks[j],win:Math.round(w/n*100),turns:(tt/n).toFixed(1),cap:Math.round(cp/n*100)});
  }
  const forms=Object.keys(FORM).map(f=>{
    let w=0;
    for(let t=0;t<n;t++)
      if (runBattle(autoPlace(B['물리'],f),f,115,null,
                    autoPlace(B['지략'],'bangwon'),'bangwon',115,null,'sim').win) w++;
    return {f:FORM[f].n, win:Math.round(w/n*100)};
  });
  simOut={rows,forms,n};
}
function rTune(){
  let h=`<div class="sect"><div class="eyebrow">전투 계수</div>
    <div class="panel hint">값을 바꾸고 시뮬레이션을 돌리면 균형이 어떻게 움직이는지 볼 수 있다.</div></div>
    <div class="sect"><div class="panel">`;
  for (const [k,nm,d,mn,mx,st] of KNOBS)
    h+=`<div class="kn"><label>${nm}${d?`<small>${d}</small>`:''}</label>
      <input type="range" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${K[k]}">
      <b id="kv-${k}">${K[k]}</b></div>`;
  h+=`</div></div><div class="sect"><div class="btnrow">
    <button class="btn" id="bSim40">40전</button>
    <button class="btn pri" id="bSim150">150전</button></div>
    <button class="btn ghost" id="bReset" style="margin-top:8px">기본값 복원</button></div>`;
  if (simOut){
    h+=`<div class="sect"><div class="eyebrow">빌드 상성 — ${simOut.n}전</div><div class="panel">
      <table class="sim"><tr><th>대결</th><th>승률</th><th>턴</th><th>판정</th></tr>
      ${simOut.rows.map(r=>{
        const dv=Math.abs(r.win-50);
        return `<tr><td>${r.a} → ${r.b}</td>
          <td class="${dv<=12?'good':dv>=28?'bad':''}">${r.win}%</td>
          <td>${r.turns}</td><td class="${r.cap<=20?'':'bad'}">${r.cap}%</td></tr>`;
      }).join('')}</table></div></div>`;
    h+=`<div class="sect"><div class="eyebrow">진형 선택의 가치</div><div class="panel">
      <table class="sim"><tr><th>물리 보드의 진형</th><th>지략 방원진 상대</th></tr>
      ${simOut.forms.map(f=>`<tr><td>${f.f}</td><td>${f.win}%</td></tr>`).join('')}</table></div></div>`;
  }
  h+=`<div class="sect"><div class="eyebrow">공식</div><div class="panel hint">
    실효 = 기본 × 열보정 × 직업적성 × 아이템 × 세력시너지 × (0.4 + 0.6 × 병력비율)<br>
    사기배율 = 0.5 + 사기 ÷ 200 (상한 200)<br>
    물리 = 공격실효 × 공격실효 ÷ (공격실효 + 방어실효) × 사기배율 × 난수<br>
    책략 = 같은 형태, 책략공격 대 책략방어 → 사기 감소<br>
    행동 순서 = 속도 × (1 ± 15%) 내림차순</div></div>`;
  $('#sc-tune').innerHTML=h;
  $('#sc-tune').querySelectorAll('input[type=range]').forEach(el=>{
    el.oninput=()=>{ K[el.dataset.k]=+el.value; $('#kv-'+el.dataset.k).textContent=el.value; };
  });
  $('#bSim40').onclick=()=>{ runSim(40); rTune(); };
  $('#bSim150').onclick=()=>{ runSim(150); rTune(); };
  $('#bReset').onclick=()=>{ Object.assign(K,KDEF); simOut=null; rTune(); };
}

/* ── 종료 · 시트 ── */
function overHTML(){
  const o=S.over;
  return `<div class="sect"><div class="panel" style="text-align:center;padding:26px 16px">
    <div style="font-family:var(--display);font-weight:800;font-size:24px;color:${o.win?'var(--jade)':'var(--seal)'}">
      ${o.win?'우승':'멸망'}</div>
    <div class="hint" style="margin:8px 0 16px">${esc(o.msg)}</div>
    <div class="num" style="font-size:15px;color:var(--bamboo)">
      최종 ${boardPower().toLocaleString()}명 · ${myPV()} PV · ${S.myW}승 ${S.myL}패</div></div></div>
    <div class="sect">${standHTML()}</div>
    <div class="sect"><button class="btn pri" id="bNew">새 판 시작</button></div>`;
}
function openPicker(queue,done){
  /* 어느 경로로 들어오든 선택권의 천장은 전설이다. 초월 위로는 조합으로만 오른다. */
  queue=queue.map(capPick);
  function step(){
    if (!queue.length){ closeSheet(); done(); render(); return; }
    const p=queue[0];
    let h=`<h3>${TIER[p.t].n} 선택권</h3>
      <div class="sub">남은 선택 ${queue.reduce((s,x)=>s+x.n,0)}회 · ${byTier(p.t).length}종${
        p.t>=FREE_TIER_CAP?' · 무상 제공의 천장':''}</div>`;
    for (const tag of TAGORDER){
      const ks=byTierTag(p.t,tag);
      if (!ks.length) continue;
      h+=`<div class="eyebrow" style="margin:11px 0 5px">${tag} ${ks.length}종</div>
        <div class="cgrid">${ks.map(k=>`<button class="card" data-k="${k}" style="border-left-color:${colorOf(k)}">
          ${facBadge(k)}<span class="nm" style="color:${colorOf(k)}">${esc(C[k].name)}</span>
          <span class="tg">공${C[k].atk} 방${C[k].def}${C[k].int?' 책'+C[k].int:''} 속${C[k].spd}</span>
          </button>`).join('')}</div>`;
    }
    openSheet(h);
    $('#sheet').querySelectorAll('.card[data-k]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      give(k);
      toast(`<b style="color:${colorOf(k)}">${esc(C[k].name)}</b> 획득 · ${gradeOf(k)}`,'gain');
      p.n--; if(p.n<=0) queue.shift(); step();
    });
  }
  step();
}
function openSheet(h){ $('#sheet').innerHTML=h; $('#mask').classList.remove('hide'); }
function closeSheet(){ $('#mask').classList.add('hide'); }

/* ── 렌더 ── */
function render(){
  $('#hDay').textContent=`솔국지 · DAY ${S.day+1} ${DAYNAME[S.day]}요일`;
  $('#hPhase').textContent=S.over?(S.over.win?'종료':'멸망'):PHASE_N[S.phase];
  $('#hPower').textContent=boardPower().toLocaleString();
  $('#hPv').textContent=myPV();
  const ranked=S.bots.map(b=>b.pv).concat([myPV()]).sort((a,b)=>b-a);
  $('#hRank').textContent=(ranked.indexOf(myPV())+1)+'위';
  $('#hBar').innerHTML=Array.from({length:21},(_,i)=>{
    const cur=phaseIdx();
    return `<span class="pseg ${i===cur?'on':i<cur?'done':''}"></span>`;
  }).join('');
  rDraw(); rForge(); rDeploy(); rBattle(); rLine(); rRank(); rTune();
  const bn=$('#bNew'); if(bn) bn.onclick=()=>{ newGame(); render();
if (typeof window!=='undefined' && window.__bootOK) window.__bootOK(); go('draw'); };
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.sc));
$('#mask').onclick=e=>{ if(e.target.id==='mask') closeSheet(); };
newGame(); render();
if (typeof window!=='undefined' && window.__bootOK) window.__bootOK();

</script>
