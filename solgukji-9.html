<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#131A2B">
<meta name="format-detection" content="telephone=no">
<title>솔국지 — 랜덤 디펜스 프로토타입</title>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
:root{
  --ink:#131A2B; --ink2:#1B2338; --ink3:#242E49; --ink4:#33405F;
  --paper:#E9E3D3; --bamboo:#C6AC7C; --bamboo-dim:#8D7B5C;
  --seal:#BE4A3C; --seal-dim:#7A3129; --jade:#4F9080; --gold:#D9A64B;
  --display:'Nanum Myeongjo','Apple SD Gothic Neo',AppleGothic,'Malgun Gothic',serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',Roboto,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#131A2B}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);
  font-size:14px;line-height:1.55;overscroll-behavior:none;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  -webkit-font-smoothing:antialiased;touch-action:manipulation}
button,input{-webkit-appearance:none;appearance:none;border-radius:0}
h1,h2,h3,.dsp,.ttl{font-family:var(--display);font-weight:800;letter-spacing:-.01em;margin:0}
.ttl{font-size:17px}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;
  -webkit-appearance:none;appearance:none;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num,.pw,.rk{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:40;background:rgba(19,26,43,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--ink3)}
.hbar{display:flex;align-items:center;gap:10px;padding:calc(9px + env(safe-area-inset-top)) 13px 7px}
.daymark{font-family:var(--display);font-weight:800;font-size:19px;line-height:1}
.daymark small{font-family:var(--body);font-weight:400;font-size:10px;color:var(--bamboo-dim);
  display:block;letter-spacing:.1em;margin-bottom:2px}
.hstat{margin-left:auto;display:flex;gap:13px;text-align:right}
.hstat div{line-height:1.2}
.hstat b{font-family:var(--mono);font-size:14px;display:block;color:var(--bamboo)}
.hstat span{font-size:9px;color:var(--bamboo-dim);letter-spacing:.08em}
.phasebar{display:flex;gap:2px;padding:0 13px 8px}
.pseg{flex:1;height:3px;background:var(--ink3);border-radius:2px}
.pseg.on{background:var(--bamboo)} .pseg.done{background:var(--bamboo-dim)}

main{padding:13px}
.screen{display:none} .screen.on{display:block}
.sect{margin-bottom:16px}
.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--bamboo-dim);margin-bottom:6px}
.panel{background:var(--ink2);border:1px solid var(--ink3);border-radius:10px;padding:12px}
.hint{font-size:12px;color:var(--bamboo-dim);line-height:1.6}
.statrow{display:flex;gap:16px}
.statrow b{font-family:var(--mono);font-size:18px;color:var(--bamboo);display:block}
.statrow span{font-size:10px;color:var(--bamboo-dim)}
.lead{margin-bottom:14px}
.lead b{display:block;font-family:var(--display);font-weight:800;font-size:18px;margin-bottom:3px}
.lead span{display:block;font-size:12px;color:var(--bamboo-dim);line-height:1.6}
.actgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.act{padding:10px 9px;border-radius:9px;background:var(--ink2);border:1px solid var(--ink3);
  text-align:left;line-height:1.3}
.act b{display:block;font-family:var(--display);font-weight:700;font-size:13px}
.act i{display:block;font-style:normal;font-size:10px;color:var(--bamboo-dim);margin-top:1px}
.act.pri{background:var(--bamboo);border-color:var(--bamboo);color:#1A1508}
.act.pri i{color:rgba(26,21,8,.65)}
.act.warn{background:var(--ink3);border-color:var(--seal)}
.act.warn b{color:#E9A79E}
.act.rnd{background:var(--ink3);border-color:var(--jade)}
.act.rnd b{color:#8FD4C2}
/* 조합 카드 —— 한 단계 위만, 재료 보유를 색으로 */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:6px}
.ucard{background:var(--ink);border:1px solid var(--ink3);border-left:3px solid var(--ink4);
  border-radius:0 8px 8px 0;padding:7px 8px;display:flex;flex-direction:column;gap:4px}
.ucard.self{margin-bottom:2px}
.ucard.ready{background:rgba(79,144,128,.10);border-color:#4F908055}
.uch{display:flex;align-items:baseline;gap:6px;text-align:left;width:100%;padding:0}
.uch b{flex:1;font-family:var(--display);font-weight:700;font-size:12px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ufr{flex:none;font-family:var(--mono);font-size:9px;color:var(--seal)}
.ufr.full{color:var(--jade)}
.umat{display:flex;flex-wrap:wrap;gap:3px}
.umat em{font-style:normal;font-size:9px;line-height:1.5;padding:1px 5px;border-radius:4px;
  white-space:nowrap}
.umat em.ok{color:#8FD4C2;background:rgba(79,144,128,.16);border:1px solid #4F908055}
.umat em.no{color:#D98C82;background:rgba(190,74,60,.12);border:1px solid #BE4A3C44}
.ubt{align-self:stretch;padding:4px;border-radius:5px;background:var(--ink3);
  border:1px solid var(--ink4);font-size:10px;color:var(--bamboo-dim)}
.ubt.on{background:var(--bamboo);border-color:var(--bamboo);color:#1A1508;font-weight:700}
.ubt:disabled{opacity:.5}
.card .amp{display:block;font-size:9px;color:var(--gold);font-weight:700;margin-top:2px}
.act:disabled{opacity:.36}
.skrow{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--ink3)}
.skrow:last-child{border-bottom:0}
.skn{flex:none;width:74px;font-family:var(--display);font-weight:700;font-size:11px;line-height:1.35}
.skb{flex:1;min-width:0}
.skb b{display:block;font-family:var(--display);font-weight:700;font-size:12px;color:var(--gold)}
.skb b em{font-style:normal;font-family:var(--body);font-weight:400;font-size:10px;
  color:var(--bamboo-dim);margin-left:5px}
.skb>span{display:block;font-size:11px;color:var(--paper);line-height:1.55;margin-top:1px}
.skb i{display:block;font-style:normal;font-size:10px;color:var(--jade);margin-top:2px}

.btn{display:block;width:100%;padding:12px;border-radius:9px;text-align:center;
  background:var(--ink3);border:1px solid var(--ink4);font-weight:500;
  transition:background .12s,transform .08s}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--bamboo);color:#1A1508;border-color:var(--bamboo);font-weight:700}
.btn.warn{background:var(--seal);color:#FFF1EE;border-color:var(--seal)}
.btn.ghost{background:none}
.btn:disabled{opacity:.34;cursor:default}
.btn small{display:block;font-weight:400;font-size:11px;opacity:.75;margin-top:2px}
.btnrow{display:flex;gap:8px} .btnrow .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:5px 10px;border-radius:14px;background:var(--ink2);
  border:1px solid var(--ink3);color:var(--bamboo-dim)}
.chip.on{background:var(--ink3);border-color:var(--bamboo);color:var(--bamboo);font-weight:500}

/* 세력 배지 */
.fac{position:absolute;top:0;left:0;font-size:8px;line-height:1;padding:2px 3px;
  border-radius:0 0 4px 0;color:#fff;font-weight:700;letter-spacing:.02em}
.tgi{position:absolute;top:1px;left:16px;color:var(--bamboo);opacity:.95}
.tgi.x{position:static;vertical-align:-1px;margin-right:3px;opacity:.85}
.tgi.hd{position:static;width:14px;height:14px;vertical-align:-2px;margin:0 4px 0 3px;opacity:.9}
.upn .tgi{opacity:.8}
.card .tgi{left:15px}
.slot .tgi{left:auto;right:3px;top:2px}
.uc .tgi{left:auto;right:2px;top:1px}
.st-row .tgi,.lg .tgi{position:static;padding:0 3px 0 1px}


/* 카드 */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.card{background:var(--ink2);border:1px solid var(--ink3);border-left:3px solid var(--ink4);
  border-radius:0 7px 7px 0;padding:12px 8px 7px;text-align:left;position:relative;overflow:hidden}
.card .nm{font-family:var(--display);font-weight:700;font-size:13px;line-height:1.25;display:block}
.card .tg{font-size:9px;color:var(--bamboo-dim);letter-spacing:.04em;display:block}
.card .ef{font-size:9px;color:var(--jade);display:block;margin-top:2px;line-height:1.35}
.card .qty{position:absolute;top:4px;right:5px;font-family:var(--mono);font-size:11px;
  color:var(--bamboo);background:var(--ink);border-radius:9px;padding:0 5px}
.card.myth{background:linear-gradient(100deg,rgba(255,215,110,.12),var(--ink2))}
.card.ondeck{box-shadow:inset 0 0 0 1px var(--bamboo)}
.card.ondeck .tg::after{content:' · 편성 중';color:var(--bamboo)}
.card.aff::after{content:'';position:absolute;bottom:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--jade)}
.card.bad::after{content:'';position:absolute;bottom:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--seal)}
.tierdot{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:1px;margin-right:4px}

/* 조합 */
.rec{padding:9px 10px;margin-bottom:5px;background:var(--ink2);border:1px solid var(--ink3);
  border-left:3px solid var(--ink4);border-radius:0 8px 8px 0;position:relative;padding-top:13px}
.rtop{display:flex;align-items:center;gap:9px}
.rsub{margin-top:7px;padding-top:6px;border-top:1px dashed var(--ink3)}
.sr{display:flex;align-items:baseline;gap:6px;font-size:10px;line-height:1.6;padding:2px 0}
.sr .srk{flex:none;font-family:var(--display);font-weight:700;font-size:11px;min-width:52px}
.sr .srm{flex:1;color:var(--bamboo-dim)}
.sr .srm em{font-style:normal;color:var(--paper)}
.sr .srm em.lack{color:var(--seal)}
.sr .srb{flex:none;padding:3px 8px;border-radius:5px;background:var(--ink3);
  border:1px solid var(--bamboo-dim);color:var(--bamboo);font-size:10px;font-weight:600}
.sr.ok .srk{text-shadow:0 0 6px currentColor}
.rec .out{min-width:84px}
.rec .out b{font-family:var(--display);font-size:13px;display:block;line-height:1.2}
.rec .out i{font-style:normal;font-size:9px;color:var(--bamboo-dim)}
.rec .mats{flex:1;font-size:10px;color:var(--bamboo-dim);line-height:1.5}
.rec .mats em{font-style:normal;color:var(--paper)}
.rec .mats em.lack{color:var(--seal)}
.rec .mats em.self{color:var(--gold);font-weight:600}
.rec .mk{padding:7px 12px;border-radius:7px;background:var(--bamboo);color:#1A1508;font-weight:700;font-size:12px}
.rec .mk:disabled{background:var(--ink3);color:var(--bamboo-dim);font-weight:400}
.rec.locked{opacity:.55}
.rsk{margin-top:6px;padding-top:5px;border-top:1px dashed var(--ink3);font-size:10px;line-height:1.5}
.rsk b{font-family:var(--display);font-weight:700;color:var(--gold);margin-right:5px}
.rsk span{color:var(--paper)}
.rsk i{font-style:normal;color:var(--jade);margin-left:5px}
.lrn em u{display:block;text-decoration:none;font-size:9px;color:var(--bamboo-dim);
  font-family:var(--body);font-weight:400;margin-top:1px}
.lrn em.own u{color:var(--gold)}
table.grd{width:100%;border-collapse:collapse;font-size:11px}
table.grd th,table.grd td{padding:4px 3px;text-align:right;border-bottom:1px solid var(--ink3)}
table.grd th{color:var(--bamboo-dim);font-weight:400;font-size:9px;letter-spacing:.06em}
table.grd tr:last-child td{border-bottom:0}
table.grd td:first-child,table.grd th:first-child{text-align:left}
table.grd td:first-child b{font-family:var(--display);font-size:12px}
table.grd td{color:#8994AC;font-family:var(--mono)}
table.grd td.has{color:var(--paper);font-weight:600}
.lg.lghd{border-bottom:1px solid var(--ink4);padding-bottom:4px}
.lgp i.hd{width:11px;height:auto;background:none;border:0;font-size:8px;text-align:center;
  font-family:var(--display);font-weight:700;line-height:1}
.mpath{margin-bottom:11px}
.mpath:last-child{margin-bottom:0}
.mph{font-family:var(--display);font-weight:700;font-size:12px;color:var(--bamboo);
  padding:5px 0 4px;border-bottom:1px solid var(--ink3);margin-bottom:5px}
.mph span{font-family:var(--body);font-weight:400;font-size:10px;color:var(--bamboo-dim);margin-left:5px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 8px;margin-bottom:4px;
  background:var(--ink);border:1px solid var(--ink3);border-radius:6px;text-align:left;width:100%}
.mrow.own{border-color:#ffd76e66;background:rgba(255,215,110,.06)}
.mrow .mn{font-family:var(--display);font-weight:700;font-size:12px}
.mrow .mt{font-size:9px;color:var(--bamboo-dim);text-align:right;font-family:var(--mono)}
.mrow .mm{grid-column:1/3;font-size:10px;color:var(--bamboo-dim);line-height:1.5}
.mrow .mm em{font-style:normal;color:#8994AC}
.mrow .mm em.ok{color:var(--paper)}
.mrow .mi{grid-column:1/3;font-size:10px}

/* 진형 선택 */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.fbtn{padding:7px 3px 6px;border-radius:8px;background:var(--ink2);border:1px solid var(--ink3);
  text-align:center;line-height:1.25}
.fbtn b{font-family:var(--display);font-size:12px;display:block}
.fbtn i{font-style:normal;font-size:8px;color:var(--bamboo-dim);display:block}
.fbtn.on{background:var(--ink3);border-color:var(--bamboo)} .fbtn.on b{color:var(--bamboo)}
.fmini{display:block;margin-top:3px}
.fmini span{display:flex;gap:1px;justify-content:center;margin-bottom:1px}
.fmini i{width:4px;height:4px;border-radius:1px;background:var(--ink4)}
.fmini i.on{background:var(--bamboo-dim)}
.fbtn.on .fmini i.on{background:var(--bamboo)}

/* 편성판 */
.board{padding:11px 5px 5px;background:var(--ink2);border:1px solid var(--ink3);border-radius:10px}
.enemyface{text-align:center;font-size:10px;letter-spacing:.22em;color:var(--seal);
  padding-bottom:8px;border-bottom:1px dashed var(--seal-dim);margin:0 8px 11px}
.frow{display:flex;align-items:stretch;gap:5px;margin-bottom:5px;padding:0 7px}
.frow .lbl{width:26px;flex:none;font-size:9px;color:var(--bamboo-dim);display:flex;align-items:center}
.frow .cells{flex:1;display:flex;gap:5px}
.frow.colhd{margin-bottom:3px}
.frow.colhd .cells span{flex:1;text-align:center;font-size:9px;color:var(--bamboo-dim);letter-spacing:.08em}
.rec .mats em .tgi{vertical-align:-1px;margin-right:1px;opacity:.7}
.slot{flex:1;min-width:0;min-height:62px;border-radius:7px;background:var(--ink);
  border:1px dashed var(--ink4);display:flex;flex-direction:column;justify-content:center;
  align-items:center;padding:9px 2px 3px;text-align:center;position:relative}
.slot.void{background:none;border:1px dotted var(--ink3);opacity:.3;min-height:62px}
.slot.filled{border-style:solid;background:var(--ink3)}
.slot .sn{font-family:var(--display);font-weight:700;font-size:11px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .st{font-size:8px;color:var(--bamboo-dim)}
.slot .sp{font-family:var(--mono);font-size:8px;color:var(--bamboo)}
.slot .islot{font-size:8px;color:var(--ink4);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .islot.has{font-weight:600}
.slot .empty{font-size:16px;color:var(--ink4)}
.slot.van{border-top:2px solid var(--seal)}
.slot.aff::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--jade)}
.slot.bad::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--seal)}
.facrow{display:flex;gap:5px}
.tsrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;padding:5px 0;
  border-bottom:1px solid var(--ink3)}
.tsrow:last-child{border-bottom:0}
.tsrow b{font-family:var(--display);font-weight:700;font-size:12px}
.tsrow em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--bamboo)}
.tsrow>span{font-size:11px;color:var(--paper)}
.tsrow i{flex-basis:100%;font-style:normal;font-size:10px;color:var(--gold)}
.tsrow u{flex-basis:100%;text-decoration:none;font-size:10px;color:var(--ink4)}
.tsrow.cap b{color:var(--gold)}
.fchip{font-size:11px;padding:3px 9px;border-radius:12px;border:1px solid var(--ink4)}

/* 전장 */
.stage{background:var(--ink2);border:1px solid var(--ink3);border-radius:10px;padding:9px 7px}
.bhead{display:flex;align-items:baseline;gap:7px;padding:0 3px 6px;flex-wrap:wrap}
.bhead b{font-family:var(--display);font-size:12px;font-weight:700;color:var(--bamboo)}
.bhead.foe b{color:var(--seal)}
.bhead span{font-size:9px;color:var(--bamboo-dim)}
.brow{display:flex;align-items:stretch;gap:5px;margin-bottom:4px}
.blbl{width:24px;flex:none;font-size:9px;color:var(--bamboo-dim);display:flex;align-items:center}
.blbl.foe{color:#8B5A52}
.bcells{flex:1;display:flex;gap:4px}
.uc{flex:1;min-width:0;background:var(--ink);border:1px solid var(--ink3);border-radius:5px;
  padding:9px 2px 3px;text-align:center;position:relative;
  transition:opacity .3s,transform .12s,box-shadow .18s}
.uc.void{background:none;border:1px dotted var(--ink3);opacity:.25}
.uc .un{display:block;font-family:var(--display);font-weight:700;font-size:10px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc .ut{display:block;font-size:8px;color:var(--bamboo-dim);line-height:1.3}
.uc .bar{height:3px;margin-top:2px}
.uc.gone{opacity:.2} .uc.gone .un{text-decoration:line-through}
.uc.act{box-shadow:0 0 0 1px var(--gold);transform:translateY(-2px)}
.uc.hurt{box-shadow:0 0 0 1px var(--seal)}
.midrule{display:flex;align-items:center;gap:8px;margin:8px 2px}
.midrule span{flex:1;height:1px;background:var(--seal-dim)}
.midrule b{font-size:9px;letter-spacing:.22em;color:var(--seal-dim);font-weight:400}
.bar{border-radius:3px;background:var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade)}
.bar.m i{background:var(--gold)} .bar.lo i{background:var(--seal)}

.feed{background:var(--ink2);border:1px solid var(--ink3);border-radius:10px;
  padding:11px;height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  font-size:13px;line-height:1.7}
.feed p{margin:0 0 3px;opacity:0;animation:fin .22s ease-out forwards}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.feed p.a{color:var(--paper)} .feed p.b{color:#9AA6BD}
.feed p.sk{color:var(--gold);font-family:var(--display);font-weight:700}
.feed p.rt{color:var(--seal);font-family:var(--display);font-weight:700}
.feed p.mo{color:#C58FA8} .feed p.hl{color:var(--jade)}
.feed p.div{color:var(--bamboo-dim);font-size:11px}
.feed hr{border:0;border-top:1px solid var(--ink3);margin:8px 0}
.verdict{font-family:var(--display);font-weight:800;font-size:19px;padding:10px 0 3px;
  animation:fin .4s ease-out forwards}
.verdict.w{color:var(--jade)} .verdict.l{color:var(--seal)}

/* 순위 · 계보 */
.st-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--ink2);
  border:1px solid var(--ink3);border-radius:8px;margin-bottom:5px;position:relative;padding-left:10px}
.st-row.me{border-color:var(--bamboo)} .st-row.out{opacity:.38}
.st-row .rk{font-size:12px;color:var(--bamboo-dim);width:16px}
.st-row .fac{position:static;border-radius:3px;padding:2px 4px;font-size:9px}
.st-row .nm{flex:1;font-family:var(--display);font-weight:700;font-size:14px}
.st-row .nm small{font-family:var(--body);font-weight:400;font-size:10px;color:var(--bamboo-dim);display:block}
.st-row .pw{font-size:12px;color:var(--bamboo)}
.lg{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ink3)}
.lg:last-of-type{border-bottom:0}
.lg .fac{position:static;border-radius:3px;padding:2px 4px;font-size:9px}
.lgt{width:28px;flex:none;font-size:11px;color:var(--bamboo-dim)}
.lgp{display:flex;gap:3px;flex:none}
.lgp i{width:11px;height:11px;border-radius:2px;background:var(--ink);border:1px solid var(--ink3)}
.lgn{flex:1;text-align:right;font-family:var(--display);font-weight:700;font-size:12px}
.lgn small{display:block;font-family:var(--body);font-weight:400;font-size:9px;color:var(--bamboo-dim)}
.lrow{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--ink3);align-items:baseline}
.lrow:last-child{border-bottom:0}
.lrt{width:32px;flex:none;font-size:11px;font-weight:700;letter-spacing:.02em}
.lrn{flex:1;font-size:12px;line-height:1.9;display:flex;flex-wrap:wrap;gap:4px}
.lrn em{font-style:normal;color:#8994AC;white-space:nowrap;
  border:1px solid var(--ink3);border-radius:4px;padding:1px 6px;background:var(--ink)}
.lrn em.own{font-weight:700;background:var(--ink3)}
.lrn em b{font-family:var(--mono);font-size:10px;opacity:.85;margin-left:3px}
.lrn em u{display:block;text-decoration:none;font-size:9px;color:var(--bamboo-dim);
  font-family:var(--display);font-weight:700;margin-top:1px}
.lrn em.own u{color:var(--gold)}
.lgp i{cursor:default}
.lrn em u{display:block;text-decoration:none;font-size:9px;color:var(--gold);margin-top:1px}
.rsk{margin-top:6px;padding-top:5px;border-top:1px dashed var(--ink3);font-size:10px;
  color:var(--paper);line-height:1.5}
.rsk::before{content:"";}
.rsk em{font-style:normal;color:var(--bamboo-dim);margin:0 4px}
.strike{width:22px;height:5px;border-radius:3px;background:var(--ink3)}
.strike.on{background:var(--seal)}
.brk{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--ink3)}
.brk:last-of-type{border-bottom:0}
.brkr{width:28px;flex:none;font-size:10px;color:var(--bamboo-dim);padding-top:3px}
.brkm{flex:1;display:flex;flex-wrap:wrap;gap:4px}
.brkp{font-size:11px;background:var(--ink);border:1px solid var(--ink3);border-radius:5px;
  padding:3px 7px;white-space:nowrap}
.brkp.now{border-color:var(--gold)}
.brkp i{font-style:normal;color:var(--ink4);margin:0 4px;font-size:9px}
.brkp em{font-style:normal;color:var(--bamboo-dim)}
.brkp em.win{color:var(--paper)}
.brkp em.me{font-family:var(--display);font-weight:700;color:var(--bamboo)}
.brkp em.me.win{color:var(--jade)}

/* 조정 */
.kn{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--ink3)}
.kn:last-child{border-bottom:0}
.kn label{flex:1;font-size:12px;line-height:1.3}
.kn label small{display:block;color:var(--bamboo-dim);font-size:10px}
.kn input[type=range]{flex:1.1;min-width:0;accent-color:var(--bamboo);
  -webkit-appearance:none;appearance:none;height:22px;background:transparent}
.kn input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--ink3)}
.kn input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:18px;height:18px;border-radius:50%;background:var(--bamboo);margin-top:-7px}
.kn b{font-family:var(--mono);font-size:12px;color:var(--bamboo);width:44px;text-align:right}
table.sim{width:100%;border-collapse:collapse;font-size:12px}
table.sim th,table.sim td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--ink3)}
table.sim th{color:var(--bamboo-dim);font-weight:400;font-size:10px}
table.sim td:first-child,table.sim th:first-child{text-align:left;font-family:var(--display);font-weight:700}
table.sim td.good{color:var(--jade)} table.sim td.bad{color:var(--seal)}
table.aff{width:100%;border-collapse:collapse;font-size:11px}
table.aff th,table.aff td{padding:4px 3px;text-align:left;border-bottom:1px solid var(--ink3);vertical-align:top}
table.aff th{color:var(--bamboo-dim);font-weight:400;font-size:9px;letter-spacing:.06em}
table.aff tr:last-child td{border-bottom:0}
table.aff td:first-child{font-family:var(--display);font-weight:700;white-space:nowrap;color:#8994AC}
table.aff tr.has td:first-child{color:var(--paper)}
table.aff td:first-child b{font-family:var(--mono);font-size:9px;color:var(--bamboo);margin-left:3px}
table.aff td.g{color:var(--jade)} table.aff td.r{color:#C4675C}

/* 시트 · 내비 */
.mask{position:fixed;inset:0;z-index:90;background:rgba(8,11,19,.82);
  display:flex;align-items:flex-end;justify-content:center}
.mask.hide{display:none}
.sheet{width:100%;max-width:560px;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--ink2);border-top:1px solid var(--ink4);border-radius:14px 14px 0 0;
  padding:15px 13px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;margin-bottom:3px}
.sheet .sub{font-size:12px;color:var(--bamboo-dim);margin-bottom:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;
  background:rgba(19,26,43,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--ink3);
  padding:6px 3px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;padding:5px 1px;text-align:center;line-height:1.2;border-radius:8px}
nav button b{font-family:var(--display);font-size:12px;font-weight:700;display:block;color:var(--bamboo-dim)}
nav button i{font-style:normal;font-size:7px;letter-spacing:.04em;color:var(--ink4)}
nav button.on b{color:var(--bamboo)} nav button.on i{color:var(--bamboo-dim)}
#toast{position:fixed;top:calc(62px + env(safe-area-inset-top));left:0;right:0;z-index:120;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 12px}
.tst{max-width:520px;width:100%;background:rgba(27,35,56,.97);border:1px solid var(--ink4);
  border-left:3px solid var(--bamboo);border-radius:8px;padding:8px 12px;font-size:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .25s ease-out}
.tst.news{border-left-color:var(--seal)}
.tst.gain{border-left-color:var(--jade)}
.tst b{font-family:var(--display);font-weight:700}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.nws{font-size:11px;line-height:1.7;color:var(--bamboo-dim);padding:2px 0;
  border-bottom:1px solid var(--ink3)}
.nws:last-child{border-bottom:0}
.nws b{font-family:var(--display);font-weight:700;color:var(--paper)}
.nws em{font-style:normal;font-weight:700}
.nws span{opacity:.7}
/* 한 단계 위 목록 —— 손패와 대조해 있다·없다가 한눈에 */
.upgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:6px}
.upc{background:var(--ink);border:1px solid var(--ink3);border-left:3px solid var(--ink4);
  border-radius:0 8px 8px 0;padding:7px 8px}
.upc.can{background:rgba(79,144,128,.10);border-color:var(--jade)}
.uph{display:flex;align-items:baseline;gap:5px}
.upn{font-family:var(--display);font-weight:700;font-size:13px;padding:0;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.upq{font-family:var(--mono);font-size:9px;color:var(--bamboo);background:var(--ink2);
  border-radius:8px;padding:0 5px;flex:none}
.upb{margin-left:auto;font-size:9px;padding:1px 5px;border-radius:4px;white-space:nowrap;flex:none}
.upb.y{color:#8FD4C2;background:rgba(79,144,128,.22)}
.upb.n{color:#C4675C;background:rgba(190,74,60,.16)}
.upm{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}

.mchip{font-size:9px;padding:2px 5px;border-radius:4px;border:1px solid var(--ink3);
  background:var(--ink2);white-space:nowrap;line-height:1.3}
.mchip.ok{color:var(--paper);border-color:rgba(79,144,128,.5)}
.mchip.no{color:#C4675C;border-color:rgba(190,74,60,.4)}
.mchip b{font-family:var(--mono);font-size:9px;margin-left:3px;opacity:.85}
.upmk{display:block;width:100%;margin-top:6px;padding:5px;border-radius:6px;
  background:var(--bamboo);color:#1A1508;font-weight:700;font-size:11px}
.upmk.off{background:var(--ink3);color:var(--bamboo-dim);font-weight:400}
.skbox{margin-top:10px;padding:8px 10px;background:var(--ink);border:1px solid var(--ink3);
  border-left:2px solid var(--gold);border-radius:0 6px 6px 0}
.skbox b{display:block;font-family:var(--display);font-weight:700;font-size:13px;color:var(--gold)}
.skbox b em{font-style:normal;font-family:var(--body);font-weight:400;font-size:10px;
  color:var(--bamboo-dim);margin-left:6px}
.skbox>span{display:block;font-size:12px;color:var(--paper);line-height:1.6;margin-top:3px}
/* 수훈갑 */
.meritcard{background:var(--ink);border:1px solid var(--ink3);border-left:3px solid var(--gold);
  border-radius:0 9px 9px 0;padding:11px 12px}
.meritcard.fell{opacity:.72}
.mh{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.mh b{font-family:var(--display);font-weight:800;font-size:17px}
.mh span:last-child{font-size:10px;color:var(--bamboo-dim);margin-left:2px}
.mrts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:5px 12px}
.mrt{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--ink3);padding:3px 0}
.mrt span{font-size:11px;color:var(--bamboo-dim)}
.mrt b{font-family:var(--mono);font-size:13px;color:var(--paper)}
.mrow2{display:flex;align-items:center;gap:5px;padding:5px 8px;background:var(--ink);
  border:1px solid var(--ink3);border-radius:6px;margin-bottom:4px}
.mrow2 .rk{font-family:var(--mono);font-size:10px;color:var(--bamboo-dim);width:12px}
.mrow2 b{font-family:var(--display);font-weight:700;font-size:12px}
.mrow2 span:last-child{margin-left:auto;font-size:10px;color:var(--bamboo-dim);font-family:var(--mono)}
.stage{scroll-margin-top:calc(66px + env(safe-area-inset-top))}
.skbox i{display:block;font-style:normal;font-size:11px;color:var(--jade);margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="boot" style="position:fixed;inset:0;z-index:200;background:#131A2B;color:#E9E3D3;
  padding:24px;font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;display:none;
  overflow:auto;-webkit-overflow-scrolling:touch">
  <div style="font-size:18px;font-weight:700;margin-bottom:10px">불러오지 못했습니다</div>
  <div id="bootMsg" style="color:#C6AC7C;font-size:12px;white-space:pre-wrap;word-break:break-all"></div>
  <div style="margin-top:16px;font-size:12px;color:#8D7B5C">
    아이폰에서 파일 앱으로 열면 미리보기라 실행되지 않습니다.
    공유 → Safari로 열기를 눌러주세요.</div>
</div>
<script>
(function(){
  function show(m){
    var b=document.getElementById('boot');
    if(!b) return;
    b.style.display='block';
    document.getElementById('bootMsg').textContent=m;
  }
  window.addEventListener('error',function(e){
    show((e.message||'오류')+'\n'+(e.filename||'')+' '+(e.lineno||'')+':'+(e.colno||''));
  });
  window.addEventListener('unhandledrejection',function(e){
    show('처리되지 않은 예외: '+(e.reason&&e.reason.message||e.reason));
  });
  window.__bootOK=function(){ var b=document.getElementById('boot'); if(b) b.remove(); };
  setTimeout(function(){
    if(!document.querySelector('#sc-draw').innerHTML)
      show('화면이 그려지지 않았습니다. 자바스크립트가 실행되지 않는 환경일 수 있습니다.');
  }, 3000);
})();
</script>

<script>

/* ═══════════════════════════════════════════════════════════
   1. 기본 정의
   ═══════════════════════════════════════════════════════════ */
/* 등급 —— pv는 허용 범위(lo~hi)이며 카드마다 다르다. 병력은 pv × 효율.
   신화는 불멸 위의 8티어로, 불멸 + 초월 + 유니크 아이템이 필요하다. */
const TIER = {
  1:{n:'기본', c:'#708090'}, 2:{n:'일반', c:'#009f27'}, 3:{n:'고급', c:'#d59700'},
  4:{n:'희귀', c:'#9932cc'}, 5:{n:'전설', c:'#fd2b2b'}, 6:{n:'초월', c:'#25e3d2'},
  7:{n:'불멸', c:'#fa8072'}, 8:{n:'신화', c:'#ffd76e'}
};
const TIERS = [1,2,3,4,5,6,7,8];
const KINDNM = {immortal:'불멸', myth:'신화', legend:'신화'};
const RATE = {4:.25, 5:.30, 6:.35, 7:.40, 8:.45};
const FAC = {
  '촉':{c:'#2fa14e', full:'촉한'}, '위':{c:'#3b6fd4', full:'조위'},
  '오':{c:'#c9403a', full:'동오'}, '군':{c:'#6b7280', full:'군웅'}
};
/* 세력 시너지 —— 편성판 9칸의 세력 구성이 진영 전체를 강화한다 */
/* 세력 시너지 —— 9칸이니 다섯 명이 상한이다. 세력마다 성격이 다르다. */
const SYN = {
  '촉':{stat:'morale', v:[15,30,50],    d:'시작 사기', extra:'다섯 명부터 사기 회복이 1.5배'},
  '위':{stat:'atk',    v:[.08,.16,.26], d:'공격력',   extra:'정예의 창끝'},
  '오':{stat:'spd',    v:[.08,.16,.26], d:'속도',     extra:'다섯 명부터 선공을 다툰다'},
  '군':{stat:'troop',  v:[.08,.18,.30], d:'병력',     extra:'물량으로 버틴다'}
};
/* 병종 시너지 —— 두 명부터 붙고 다섯 명에서 고유 효과가 열린다.
   아홉 칸이라 한 병종을 다섯까지 모으는 건 현실적인 목표다. */
const TAGSYN = {
  '창병':{stat:'troop', v:[.08,.17,.27,.40], d:'병력', cap:'반격', capd:'물리 피격 시 70% 확률로 되받아친다'},
  '기병':{stat:'atk', v:[.03,.06,.10,.15], d:'공격력', cap:'선봉', capd:'첫 턴에 기병이 먼저 움직인다'},
  '궁병':{stat:'rate',v:[.03,.06,.09,.14], d:'스킬 발동률', cap:'관통', capd:'후열을 직접 노린다'},
  '도적':{stat:'atk', v:[.07,.14,.22,.32], d:'공격력', cap:'회피', capd:'물리 공격을 45% 확률로 흘린다'},
  '책사':{stat:'int', v:[.06,.12,.19,.28], d:'책략', cap:'중용', capd:'걸어둔 상태이상이 한 턴 더 간다'},
  '유생':{stat:'res', v:[.07,.14,.22,.32], d:'책략방어', cap:'인화', capd:'턴마다 아군 병력이 4.5% 회복되고 패주 확률이 절반이 된다'},
  '술사':{stat:'stx', v:[.20,.38,.58,.85], d:'상태이상 효과', cap:'현혹', capd:'상태이상 저항을 무시한다'},
  '모사':{stat:'brk', v:[.09,.18,.28,.40], d:'적 책략방어 감소', cap:'봉계', capd:'책략이 30% 확률로 스킬을 봉인한다'}
};
const TAGSYN_STEP = [2,3,4,5];
const SYN_STEP = [3,4,5];

/* 상태이상 —— 지략 계열이 판을 흔드는 수단.
   화상·수몰은 병력을 직접 깎아 사기만 깎던 지략을 실전용으로 만든다. */
const STATUS = {
  burn:   {n:'화상', c:'#e07a3c', d:'턴마다 병력이 타 들어간다'},
  flood:  {n:'수몰', c:'#4a9ad4', d:'병력이 잠기고 발이 묶인다'},
  confuse:{n:'혼란', c:'#b57edc', d:'행동하지 못한다'},
  bleed:  {n:'출혈', c:'#c4564a', d:'상처가 벌어져 병력이 흘러나간다'},
  plague: {n:'역병', c:'#7fa86b', d:'턴마다 사기가 꺾인다'},
  seal:   {n:'봉인', c:'#8d8d8d', d:'스킬을 쓸 수 없다'}
};

/* 전투 계수 —— 시뮬레이션으로 교정한 기본값 */
const K = {
  troop:22, intTroop:12, morale:0.029, aoe:0.80, regen:6,
  routSame:8, routOther:2, hit50:12, hit25:18,
  routMin:0.09, routSlope:0.025, cap:20,
  guard:0.66, guardFrom:5   /* 전설 이상은 등급 차이만큼 책략 사기 피해를 흘린다 */
};

/* 등급별 배율 —— 상위 등급일수록 배율·사기·지속이 커진다 */
const SKMUL = {4:0.95, 5:1.05, 6:1.20, 7:1.40, 8:1.60};
const SKDUR = {4:0, 5:0, 6:0, 7:1, 8:1};
function buildSkill(tag, idx, tier){
  const base=SKILLPOOL[tag][idx % SKILLPOOL[tag].length];
  const m=SKMUL[tier]||1, e={kind:base.k, tgt:base.tgt};
  if (base.mult)   e.mult = +(base.mult*m).toFixed(3);
  if (base.morale) e.morale = +(base.morale*m).toFixed(1);
  if (base.exec)   e.exec = base.exec;
  if (base.spd)    e.spd = base.spd;
  if (base.foeSpd) e.foeSpd = base.foeSpd;
  if (base.resDown)e.resDown = base.resDown;
  if (base.selfBuff) e.selfBuff = base.selfBuff;
  if (base.allyBuff) e.allyBuff = base.allyBuff;
  if (base.cleanse)  e.cleanse = base.cleanse;
  if (base.tHeal)    e.tHeal = +(base.tHeal*m).toFixed(4);
  if (base.pierce)   e.pierce = base.pierce;
  if (base.stance)   e.stance = base.stance;
  if (base.status){
    const s=base.status;
    /* 화상·수몰은 대상 병력에 비례하므로 비율로 두고, 사기 계열은 절대값 */
    e.status = {k:s.k,
      val: (s.k==='burn'||s.k==='flood') ? +(s.val*m).toFixed(3) : +(s.val*m).toFixed(1),
      dur: s.dur + (SKDUR[tier]||0)};
  }
  return {n:base.n, eff:e, psv:null};
}

  let need=n;

  if (fromInv){ S.inv[k]-=fromInv; need-=fromInv; if(S.inv[k]<=0) delete S.inv[k]; }
  for (let i=0; i<9 && need>0; i++) if (S.board[i]===k){
    S.board[i]=null; S.equip[i]=null; need--;

};

function gainItem(){
  const p = S.day*3+S.phase;
  let grade;
  if (UNIQUE_PHASES.indexOf(p)>=0) grade='유니크';   /* 정해진 아침에만 확정 지급 */

    const tbl = DROP.find(d=>p<=d.upto).w;
    let tot=0; for(const g in tbl) tot+=tbl[g];
    let r=Math.random()*tot; grade='일반';
    for(const g in tbl){ r-=tbl[g]; if(r<=0){ grade=g; break; } }
  }
  let pool = Object.keys(IT).filter(k=>IT[k].grade===grade);
  /* 보급은 지금 세운 군세에 맞는 물건이 온다. 유니크는 특히 그렇다. */
  const tags = new Set(S.board.filter(Boolean).map(k=>C[k].tag));
  Object.keys(S.inv).forEach(k=>{ if(C[k].tier>=5) tags.add(C[k].tag); });
  if (tags.size){
    const fit = pool.filter(k=>tags.has(IT[k].tag));
    if (fit.length && (grade==='유니크' || Math.random()<0.7)) pool = fit;
  }

}

function matCount(mats){ const m={}; for(const x of mats) m[x]=(m[x]||0)+1; return m; }
function needItem(out){ return C[out].need ? ITEM_BY_NAME[C[out].need] : null; }
function canForge(out, mats){
  const m=matCount(mats);
  if (!Object.keys(m).every(k=>have(k)>=m[k])) return false;
  const ni = needItem(out);
  if (ni && !(S.bag[ni]>0)) return false;
  return true;
}
function forge(out, mats){
  if (!canForge(out,mats)) return false;
  const m=matCount(mats);
  for (const k in m) take(k,m[k]);
  const ni=needItem(out);
  if (ni){ S.bag[ni]--; if(S.bag[ni]<=0) delete S.bag[ni]; }
  give(out); return true;
}
function tierStock(t){
  const p=pool(), o={};
  sortCards(Object.keys(p)).forEach(k=>{ if(C[k].tier===t) o[k]=p[k]; });
  return o;
}
const tierTotal = t => Object.values(tierStock(t)).reduce((a,b)=>a+b,0);
function trade(from, want){
  if (S.trades<=0 || C[from].tier!==C[want].tier || have(from)<1) return false;
  take(from,1); give(want); S.trades--; return true;
}
/* 연관 조합 —— 지금 손패로 얼마나 가까운지 순으로 */
function nearRecipes(limit){
  const out=[];
  for (const [o,mats] of REC){
    const m=matCount(mats);
    let short=0, tot=0;
    for (const k in m){ tot+=m[k]; short+=Math.max(0,m[k]-have(k)); }
    const ni=needItem(o);
    const noItem = ni && !(S.bag[ni]>0);
    if (short===tot) continue;                 /* 재료가 하나도 없으면 제외 */
    out.push({out:o, mats, short, tot, noItem});
  }
  out.sort((a,b)=>(a.short-b.short) || (C[b.out].tier-C[a.out].tier));
  return out.slice(0, limit||12);
}

  for (let g=0; g<400; g++){
    let lo=0; for(let i=1;i<9;i++) if(tiers[i]<tiers[lo]) lo=i;
    const t=tiers[lo]; if(t>=7) break;          /* 봇은 신화를 만들지 않는다 */
    const cost=mid(t+1)-mid(t);
    if (spent+cost>pv) break;
    tiers[lo]=t+1; spent+=cost;
  }
  const pl=POOLS[style];
  const cards=tiers.map(t=>{
    const src=(pl[t]&&pl[t].length)?pl[t]:POOLS['균형'][t];
    const ok=src.filter(k=>C[k].tier<8);   /* 봇은 신화를 쓰지 않는다 */
    return pickR(ok.length?ok:src);
  });
  return {cards, form:STYLE_FORM[style], power:cards.reduce((s,k)=>s+C[k].tr,0)};
}
/* 자동 편성 —— 각 카드를 선호 구역에 앉히려 시도한다.
   같은 열이라도 중앙과 측면을 가리므로 배치가 자연히 흩어진다. */
function autoPlace(cards, form){
  const f=FORM[form];
  const order=cards.slice().filter(Boolean)
    .sort((a,b)=>(C[b].tier-C[a].tier) || (FRONT_WANT[C[b].tag]-FRONT_WANT[C[a].tag]));
  const out=new Array(9).fill(null), used=new Array(9).fill(false);
  const score=(k,i)=>{
    const s=f.slots[i]; if(!s) return -99;
    const z=affOf(C[k].tag, s.line, s.side);
    return (z==='pref'?6:z==='bad'?-4:0)
      - Math.abs(LINE[s.line].pri - (4-FRONT_WANT[C[k].tag]))*0.6;
  };
  for (const k of order){
    let best=-1, bs=-1e9;
    for (let i=0;i<9;i++){
      if (used[i]||!f.slots[i]) continue;
      const v=score(k,i);
      if (v>bs){ bs=v; best=i; }
    }
    if (best>=0){ used[best]=true; out[best]=k; }
  }
  return out;
}

/* 추천 아이템 —— 가방에서 태그가 맞는 최상 등급을 고른다 */
function recommendItems(){
  const used={};
  const eq=new Array(9).fill(null);
  const order=['유니크','레어','매직','일반'];
  const slots=S.board.map((k,i)=>({k,i})).filter(o=>o.k && C[o.k].kind!=='myth')
    .sort((a,b)=>C[b.k].tier-C[a.k].tier);
  for (const {k,i} of slots){
    const cand=Object.keys(S.bag).filter(it=>IT[it].tag===C[k].tag
      && (S.bag[it]-(used[it]||0))>0
      && !(IT[it].use==='myth'));       /* 유니크 재료는 장착 대신 조합에 남긴다 */
    if (!cand.length) continue;
    cand.sort((a,b)=>order.indexOf(IT[a].grade)-order.indexOf(IT[b].grade));
    eq[i]=cand[0]; used[cand[0]]=(used[cand[0]]||0)+1;
  }
  return eq;
}

/* ═══════════════════════════════════════════════════════════
   7. 전투 엔진
   ═══════════════════════════════════════════════════════════ */
function facSyn(cards, form){
  const fc={}, tc={};
  cards.forEach(k=>{ if(!k) return;
    fc[C[k].fac]=(fc[C[k].fac]||0)+1;
    tc[C[k].tag]=(tc[C[k].tag]||0)+1; });
  const out={morale:0, atk:1, spd:1, troop:1, list:[], count:fc,
             tag:{}, tagList:[], tagCount:tc, caps:{},
             boon: form ? FORMBOON[form] : null};
  /* 세력 */
  for (const f in fc){
    const s=SYN[f]; if(!s) continue;
    let lv=-1; SYN_STEP.forEach((st,i)=>{ if(fc[f]>=st) lv=i; });
    if (lv<0) continue;
    const v=s.v[lv];
    if (s.stat==='morale') out.morale+=v; else out[s.stat]*=(1+v);
    out.list.push({fac:f, n:fc[f], lv:lv+1, v});
    if (f==='촉' && fc[f]>=5) out.regenUp=true;
    if (f==='오' && fc[f]>=5) out.fastSide=true;
  }
  /* 병종 —— 태그별 보정과 다섯 명 고유 효과 */
  for (const t in tc){
    const s=TAGSYN[t]; if(!s) continue;
    let lv=-1; TAGSYN_STEP.forEach((st,i)=>{ if(tc[t]>=st) lv=i; });
    if (lv<0) continue;
    out.tag[t]={stat:s.stat, v:s.v[lv], lv:lv+1};
    out.tagList.push({tag:t, n:tc[t], lv:lv+1, v:s.v[lv], stat:s.stat});
    if (tc[t]>=5){ out.caps[t]=s.cap; }
  }
  return out;
}
function mkUnit(cid, line, camp, morale, slot, item, syn, side){
  const c=C[cid];
  const ts=(syn.tag&&syn.tag[c.tag])||null;
  return {c, line, side:side||'중앙', camp, slot, key:camp+slot, item,
          troops:Math.round(c.tr*syn.troop*(ts&&ts.stat==='troop'?1+ts.v:1)),
          max:Math.round(c.tr*syn.troop*(ts&&ts.stat==='troop'?1+ts.v:1)),
          morale:Math.min(200, morale+syn.morale), synAtk:syn.atk, synSpd:syn.spd,
          ts, caps:syn.caps||{}, regenUp:!!syn.regenUp, fastSide:!!syn.fastSide,
          boon:(syn.boon && syn.boon.tags.includes(c.tag)) ? syn.boon : null,
          buffs:[], alive:true, hit50:false, hit25:false, psv:(c.sk&&c.sk.psv)||null,
          dmg:0, mdmg:0, heal:0, kills:0, lastHit:null, st:[]};
}
function eff(u, stat){
  const c=u.c, lm=LINE[u.line], af=AFF[c.tag];
  let v=c[stat];
  if (stat==='atk') v*=lm.atk;
  if (stat==='def') v*=lm.def;
  if (stat==='int') v*=lm.int;
  if (u.psv==='vanguard'  && stat==='atk' && lm.pri<=2) v*=1.15;
  if (u.psv==='rearguard' && stat==='int' && lm.pri>=3) v*=1.15;
  const zone=affOf(c.tag, u.line, u.side);
  if (zone==='pref' && af.b[stat]) v*=af.b[stat];
  if (zone==='bad'  && af.p[stat]) v*=af.p[stat];
  if (u.item){
    const it=IT[u.item];
    /* 신화 장수가 자기 전용 유니크를 들면 효과가 증폭된다 */
    const amp = (u.c.need && ITEM_BY_NAME[u.c.need]===u.item) ? MYTH_AMP : 1;
    if (it.pri===stat) v*=(1+it.pa*amp);
    if (it.sec===stat) v*=(1+it.sa*amp);
  }
  if (stat==='atk') v*=u.synAtk;
  if (stat==='spd') v*=u.synSpd;
  /* 병종 시너지 —— 같은 병종을 모으면 그 병종다운 곳이 강해진다 */
  if (u.ts && u.ts.stat===stat) v*=(1+u.ts.v);
  /* 진형 적합 —— 진형이 품는 병종이면 한 번 더 붙는다 */
  if (u.boon && u.boon.stat===stat) v*=(1+u.boon.v);
  for (const b of u.buffs) if (b.stat===stat) v*=(1+b.amt);
  if (u.allyRes && stat==='res') v*=1.10;
  if (stat==='atk'||stat==='int') v*=(0.4+0.6*(u.troops/u.max));
  return Math.max(1,v);
}
const MYTH_AMP = 1.6;      /* 전용 유니크의 증폭 배수 */
const isSignature = (cardId,itemId) => !!(C[cardId].need && ITEM_BY_NAME[C[cardId].need]===itemId);
const hasSt = (u,k) => u.st && u.st.some(s=>s.k===k);
const skRate = u => hasSt(u,'seal') ? 0
  : RATE[u.c.tier] + (u.item ? IT[u.item].rb/100 * (isSignature(u.c.id,u.item)?MYTH_AMP:1) : 0)
    + ((u.ts && u.ts.stat==='rate') ? u.ts.v : 0)
    + ((u.boon && u.boon.stat==='rate') ? u.boon.v : 0);
const mMul = u => 0.5 + Math.min(200,Math.max(0,u.morale))/200;
/* 등급 방벽 —— 전설 이상 유닛은 아래 등급이 거는 책략에 사기가 덜 흔들린다.
   희귀 지략가 여러 명이 불멸의 사기를 무너뜨리는 상황을 막는다. */
function moraleGuard(atk, def){
  if (!atk || def.c.tier < K.guardFrom) return 1;
  const gap = def.c.tier - atk.c.tier;
  return gap<=0 ? 1 : Math.max(0.18, Math.pow(K.guard, gap));
}
const liveOf=(us,s)=>us.filter(u=>u.alive&&u.camp===s);

function resolveTargets(spec, foes, self, allies){
  const live=foes.filter(u=>u.alive); if(!live.length) return [];
  const pri=live.map(u=>LINE[u.line].pri);
  const mn=Math.min(...pri), mx=Math.max(...pri);
  const front=live.filter(u=>LINE[u.line].pri===mn);
  const back =live.filter(u=>LINE[u.line].pri===mx);
  if (spec==='front1') return [pickR(front)];
  if (spec==='back1')  return [pickR(back)];
  if (spec==='back2')  return live.slice().sort((a,b)=>LINE[b.line].pri-LINE[a.line].pri).slice(0,2);
  if (spec==='front3') return live.slice().sort((a,b)=>LINE[a.line].pri-LINE[b.line].pri).slice(0,3);
  if (spec==='all')    return live;
  if (spec==='self')   return [self];
  if (spec==='allyAll')return allies.filter(u=>u.alive);
  if (spec==='allyFront'){
    const al=allies.filter(u=>u.alive); if(!al.length) return [];
    const p=Math.min(...al.map(u=>LINE[u.line].pri));
    return al.filter(u=>LINE[u.line].pri===p);
  }
  if (spec==='denseLine'){
    const g={}; live.forEach(u=>{(g[u.line]=g[u.line]||[]).push(u)});
    return Object.values(g).sort((a,b)=>b.length-a.length)[0];
  }
  if (spec.startsWith('line:')){
    const want=spec.slice(5).split('+');
    const m=live.filter(u=>want.includes(u.line));
    return m.length?m:front;
  }
  return front;
}
function basicTarget(u, foes){
  const af=AFF[u.c.tag];
  if (u.c.tag==='궁병' && (u.caps['궁병'] || affOf(u.c.tag,u.line,u.side)==='pref'))
    return resolveTargets('back1',foes);
  if (u.c.tag==='도적') return resolveTargets('back1',foes);
  if (u.c.int>u.c.atk)  return resolveTargets('back1',foes);
  return resolveTargets('front1',foes);
}
const NM = u => (u.camp==='B' ? '적 ' : '') + u.c.name;

function runBattle(aCards, aForm, aMorale, aEquip, bCards, bForm, bMorale, bEquip, title, foeName){
  const ev=[], units=[];
  const aSyn=facSyn(aCards,aForm), bSyn=facSyn(bCards,bForm);
  const aS=FORM[aForm].slots, bS=FORM[bForm].slots;
  aCards.forEach((k,i)=>{ if(k&&aS[i]) units.push(mkUnit(k,aS[i].line,'A',aMorale,i,
    (aEquip&&aEquip[i])||innateItem(k), aSyn, aS[i].side)); });
  bCards.forEach((k,i)=>{ if(k&&bS[i]) units.push(mkUnit(k,bS[i].line,'B',bMorale,i,
    (bEquip&&bEquip[i])||innateItem(k), bSyn, bS[i].side)); });
  const aRes=aCards.some(k=>k&&C[k].sk&&C[k].sk.psv==='allyRes');
  const bRes=bCards.some(k=>k&&C[k].sk&&C[k].sk.psv==='allyRes');
  for (const u of units) u.allyRes = (u.camp==='A'?aRes:bRes);
  for (const cp of ['A','B']){
    if (!units.some(u=>u.camp===cp && u.psv==='lord')) continue;
    for (const u of units) if (u.camp===cp) u.morale=Math.min(200,u.morale+15);
  }
  const L=(cls,text,focus)=>ev.push({c:cls,t:text,f:focus||null,
    s:units.map(u=>[Math.max(0,Math.round(u.troops)),Math.round(u.morale),u.alive?1:0])});

  function physHit(a,d,mult,noCounter,pierce){
    /* 도적 다섯 — 회피 */
    if (d.caps['도적'] && d.c.tag==='도적' && Math.random()<0.45){
      L('mo',`${NM(d)}이 몸을 틀어 흘려냈다`,d.key); return;
    }
    const A=eff(a,'atk');
    let D=eff(d,'def');
    if (pierce) D*=(1-pierce);            /* 관통 —— 방어를 그만큼 무시한다 */
    const dmg=A*(A/(A+D))*mMul(a)*rnd(.9,1.1)*mult;
    const loss=Math.max(1,Math.round(dmg*K.troop));
    d.troops-=loss; a.dmg+=loss; d.lastHit=a;
    L(a.camp,`${GA(NM(a))} ${EUL(NM(d))} 들이쳤다 — 병력 ${loss.toLocaleString()} 손실`,d.key);
    /* 반격 —— 창병 다섯의 「반격」 또는 반격태세를 두른 유닛 */
    if (!noCounter && d.alive){
      const stance=d.buffs.find(b=>b.stat==='counter');
      const p = (d.caps['창병'] && d.c.tag==='창병' ? 0.70 : 0) + (stance ? stance.amt : 0);
      if (p>0 && Math.random()<p){
        L('sk',`${GA(NM(d))} 창을 되받아 찔렀다`,d.key);
        physHit(d,a,1.28,true);
      }
    }
  }
  /* 책략 공격은 사기를 흔들면서 병력도 함께 깎는다.
     병력 계수가 물리보다 낮아 결정력은 떨어지지만, 지략만으로도 적을 무너뜨릴 수 있다. */
  function intHit(a,d,mult,spread){
    const I=eff(a,'int'); let R=eff(d,'res');
    if (a.psv==='resBreak') R*=0.8;
    if (a.ts && a.ts.stat==='brk') R*=(1-a.ts.v);   /* 모사 시너지 */
    const dmg=I*(I/(I+R))*mMul(a)*rnd(.9,1.1)*mult;
    let ml=dmg*K.morale*(spread>=3?K.aoe:1)*moraleGuard(a,d);
    if (a.psv==='statusUp') ml*=1.3;
    if (d.psv==='intShield') ml*=0.6;
    d.morale-=ml;
    const loss=Math.max(1,Math.round(dmg*K.intTroop*(spread>=3?K.aoe:1)));
    d.troops-=loss; a.dmg+=loss; a.mdmg+=ml; d.lastHit=a;
    L('mo',`${NM(a)}의 계략이 ${NM(d)}의 진을 흔들었다 — 병력 ${loss.toLocaleString()} · 사기 ${ml.toFixed(0)}`,d.key);
  }
  function moraleHit(d,amt,who,spread,src){
    let a=amt*(spread>=3?K.aoe:1)*moraleGuard(src,d);
    if (src&&src.psv==='statusUp') a*=1.3;
    if (d.psv==='intShield') a*=0.6;
    d.morale-=a;
    if (src) src.mdmg+=a;
    L('mo',`『${who}』에 ${NM(d)}의 군세가 술렁인다 — 사기 ${a.toFixed(0)} 감소`,d.key);
  }
  /* 병력 회복 —— 유생이 소모전에서 값을 갖게 하는 수단.
     최대 병력을 넘지 않고, 무너진 칸은 되살리지 않는다. */
  function healTroop(d,ratio,who,src){
    if (!d.alive) return;
    const g=Math.min(Math.round(d.max*ratio), d.max-d.troops);
    if (g<=0) return;
    d.troops+=g;
    if (src) src.heal+=g/300;
    L('hl',`『${who}』에 ${NM(d)}의 대오가 정비된다 — 병력 +${g.toLocaleString()}`,d.key);
  }
  function healMorale(d,amt,who,src){
    const b=d.morale; d.morale=Math.min(200,d.morale+amt);
    const g=d.morale-b;
    if (src && g>0) src.heal+=g;
    if (g>0.5) L('hl',`『${who}』에 ${NM(d)}의 군세가 다시 일어선다 — 사기 +${g.toFixed(0)}`,d.key);
  }
  function addBuff(u,b){
    u.buffs.push({stat:b.stat,amt:b.amt,dur:b.dur});
    L('sk',`${NM(u)}의 ${STATNM[b.stat]||b.stat}이 ${b.amt>0?'올랐다':'꺾였다'} · ${b.amt>0?'+':''}${Math.round(b.amt*100)}%`,u.key);
  }
  /* 상태이상 부여 —— 술사 시너지가 효과를 키우고, 책사 시너지가 지속을 늘린다 */
  function inflict(a,d,kind,val,dur){
    if (!d.alive) return;
    const stx = (a && a.ts && a.ts.stat==='stx') ? (1+a.ts.v) : 1;
    const ext = ((a&&a.caps&&a.caps['책사'])?1:0) + ((a&&a.caps&&a.caps['술사'])?1:0);
    /* 술사 다섯(현혹)은 등급 저항을 무시한다 —— 감쇠 없이 1배로 들어간다 */
    const resist = (a && a.caps && a.caps['술사']) ? 1
                 : (d.c.tier>=K.guardFrom ? moraleGuard(a,d) : 1);
    /* 화상·수몰은 대상 병력에 비례한다. 비율을 절대값으로 환산해 담는다. */
    const scale = (kind==='burn'||kind==='flood'||kind==='bleed') ? d.max : 1;
    const v = Math.max(1, Math.round((val||0)*scale*stx*resist));
    const t = (dur||1) + ext;
    const old = d.st.find(s=>s.k===kind);
    if (old){ old.val=Math.max(old.val,v); old.dur=Math.max(old.dur,t); }
    else {
      /* 한 유닛이 동시에 지는 상태이상은 두 종까지. 겹쳐 쌓여 순삭되는 일을 막는다. */
      if (d.st.length>=2){ const w=d.st.reduce((a,b)=>a.dur<=b.dur?a:b); d.st.splice(d.st.indexOf(w),1); }
      d.st.push({k:kind, val:v, dur:t});
    }
    const per = (kind==='burn'||kind==='bleed') ? `턴당 ${v.toLocaleString()}`
              : (kind==='flood') ? `턴당 ${Math.round(v*0.7).toLocaleString()}`
              : (kind==='plague') ? `턴당 사기 ${v}` : '';
    L('st',`${NM(d)}이 『${STATUS[kind].n}』에 걸렸다 — ${t}턴${per?' · '+per:''}`,d.key);
  }
  function cleanse(u){
    if (!u.st.length) return false;
    const nm=STATUS[u.st[0].k].n; u.st.shift();
    L('hl',`${NM(u)}의 『${nm}』이 씻겼다`,u.key);
    return true;
  }
  /* 턴 끝 상태이상 처리 */
  function tickStatus(){
    for (const u of units){
      if (!u.alive || !u.st.length) continue;
      for (const s of u.st){
        if (s.k==='burn'){ const l=Math.round(s.val); u.troops-=l;
          L('st',`${NM(u)}이 불길에 휩싸인다 — 병력 ${l.toLocaleString()} 손실`,u.key); }
        else if (s.k==='flood'){ const l=Math.round(s.val*0.7); u.troops-=l;
          L('st',`${NM(u)}의 진영이 물에 잠긴다 — 병력 ${l.toLocaleString()} 손실`,u.key); }
        else if (s.k==='bleed'){ const l=Math.round(s.val); u.troops-=l;
          L('st',`${NM(u)}의 상처가 벌어진다 — 병력 ${l.toLocaleString()} 손실`,u.key); }
        else if (s.k==='plague'){ u.morale-=s.val;
          L('st',`${NM(u)}의 군세에 역병이 돈다 — 사기 ${s.val.toFixed(0)} 감소`,u.key); }
      }
      u.st.forEach(s=>s.dur--);
      u.st=u.st.filter(s=>s.dur>0);
    }
    /* 유생 다섯 —— 턴마다 아군 하나를 씻는다 */
    for (const cp of ['A','B']){
      const side=units.filter(u=>u.alive&&u.camp===cp);
      if (!side.length || !side[0].caps['유생']) continue;

  function rout(u,why){
    if (!u.alive) return;
    u.alive=false;
    if (u.lastHit && u.lastHit.camp!==u.camp) u.lastHit.kills++;
    for (const o of units){
      if (!o.alive||o.camp!==u.camp) continue;
      const cut=(o.psv==='noAllyRoutLoss')?0.5:1;
      o.morale-=(o.line===u.line?K.routSame:K.routOther)*cut;

  let turn=0, winner=null;
  while (turn<K.cap && !winner){
    turn++;
    if (turn>1) L('div','');
    for (const u of units) u.buffs=u.buffs.filter(b=>--b.dur>0);
    const order=units.filter(u=>u.alive)
      .map(u=>{
        let sp = u.psv==='firstStrike' ? eff(u,'spd')*1.25
               : u.psv==='swift' ? eff(u,'spd')*(1+rnd(-.07,.07))
               : eff(u,'spd')*(1+rnd(-.15,.15));
        if (turn===1 && u.caps['기병'] && u.c.tag==='기병') sp*=1.6;  /* 기병 다섯 — 선봉 */
        if (u.fastSide) sp*=1.12;                                     /* 오 다섯 — 선공 다툼 */
        return {u, sp};
      })
      .sort((x,y)=>y.sp-x.sp).map(o=>o.u);

    order.forEach((u,ui)=>{
      if (!u.alive) return;
      if (hasSt(u,'confuse')){
        L('st',`${NM(u)}이 혼란에 빠져 움직이지 못한다`,u.key); return;
      }
      const foes=units.filter(o=>o.camp!==u.camp), allies=units.filter(o=>o.camp===u.camp);
      if (!foes.some(o=>o.alive)) return;
      const sk=u.c.sk; let used=false;
      if (sk && Math.random()<skRate(u)){
        const e=sk.eff; let ok=true;
        if (e.cond==='first' && ui!==0) ok=false;
        if (e.cond==='hurt' && u.troops/u.max>0.5) ok=false;
        if (ok){
          used=true;
          L('sk',`${GA(NM(u))} 『${sk.n}』${jong(sk.n)?'을':'를'} 펼친다`,u.key);
          if (e.kind==='phys'){
            const ts=resolveTargets(e.tgt,foes,u,allies);
            for (const t of ts){
              if(!t.alive) continue;
              physHit(u,t,e.mult,false,e.pierce);
              if (e.exec && t.troops>0 && t.troops/t.max<=e.exec) rout(t,'한 칼에 짓밟혔다');
              if (e.morale) moraleHit(t,e.morale,sk.n,ts.length,u);
              if (e.spd) addBuff(t,{stat:'spd',amt:e.spd.amt,dur:e.spd.dur});
              if (e.resDown) addBuff(t,{stat:'res',amt:e.resDown.amt,dur:e.resDown.dur});
              if (e.status) inflict(u,t,e.status.k,e.status.val,e.status.dur);
            }
            if (e.selfBuff) addBuff(u,e.selfBuff);
            if (e.stance) u.buffs.push({stat:'counter', amt:e.stance.amt, dur:e.stance.dur});
            if (e.allyBuff) for (const t of resolveTargets(e.allyBuff.tgt,foes,u,allies)) addBuff(t,e.allyBuff);
          } else if (e.kind==='int'){
            const ts=resolveTargets(e.tgt,foes,u,allies);
            for (const t of ts){
              if(!t.alive) continue;
              intHit(u,t,e.mult,ts.length);
              if (e.morale) moraleHit(t,e.morale,sk.n,ts.length,u);
              if (e.resDown) addBuff(t,{stat:'res',amt:e.resDown.amt,dur:e.resDown.dur});
              if (e.status) inflict(u,t,e.status.k,e.status.val,e.status.dur);
              /* 모사 다섯 — 봉계: 책략이 스킬을 봉인한다 */
              if (u.caps['모사'] && Math.random()<0.30) inflict(u,t,'seal',1,2);
            }
            /* 책략을 쓰면서 아군을 다스리는 계열 */
            if (e.heal) for (const t of allies) if(t.alive) healMorale(t,e.heal,sk.n,u);
            if (e.tHeal) for (const t of allies) if(t.alive) healTroop(t,e.tHeal,sk.n,u);
            if (e.cleanse){ let n=e.cleanse;
              for (const t of allies){ if(n<=0) break; if(t.alive&&t.st.length&&cleanse(t)) n--; } }
            if (e.allyBuff) for (const t of resolveTargets(e.allyBuff.tgt,foes,u,allies)) addBuff(t,e.allyBuff);
          } else if (e.kind==='morale'){
            const ts=resolveTargets(e.tgt,foes,u,allies);
            for (const t of ts){
              if(!t.alive) continue;
              moraleHit(t,e.morale,sk.n,ts.length,u);
              if (e.foeSpd) addBuff(t,{stat:'spd',amt:e.foeSpd.amt,dur:e.foeSpd.dur});
              if (e.status) inflict(u,t,e.status.k,e.status.val,e.status.dur);
            }
          } else if (e.kind==='heal'){
            for (const t of resolveTargets(e.tgt,foes,u,allies)) if(t.alive) healMorale(t,e.morale,sk.n,u);
            if (e.tHeal) for (const t of allies) if(t.alive) healTroop(t,e.tHeal,sk.n,u);
            if (e.allyBuff) for (const t of resolveTargets(e.allyBuff.tgt,foes,u,allies)) addBuff(t,e.allyBuff);
            if (e.cleanse){ let n=e.cleanse;
              for (const t of allies){ if(n<=0) break; if(t.alive&&t.st.length&&cleanse(t)) n--; } }
          } else if (e.kind==='res'){
            const ts=resolveTargets(e.tgt,foes,u,allies);
            for (const t of ts){
              if(!t.alive) continue;
              addBuff(t,{stat:'res',amt:e.amt,dur:e.dur});
              if (e.morale) moraleHit(t,e.morale,sk.n,ts.length,u);
            }
          }
        }
      }
      if (!used){
        const t=basicTarget(u,foes)[0];
        if (t&&t.alive){ if (u.c.int>u.c.atk) intHit(u,t,1,1); else physHit(u,t,1); }
      }
      for (const o of units) if (o.alive && o.troops<=0) rout(o,'병력이 다해 무너졌다');
    });

    for (const u of units){
      if (!u.alive) continue;
      const r=u.troops/u.max, tg=(u.psv==='tough')?0.5:1;
      if (!u.hit50 && r<=0.5){ u.hit50=true; u.morale-=K.hit50*tg; }
      if (!u.hit25 && r<=0.25){ u.hit25=true; u.morale-=K.hit25*tg; }
      if (u.morale>30 && u.morale<100){
        let rg=K.regen*(u.regenUp?1.5:1);
        if (u.caps['유생']) rg*=2;          /* 유생 다섯 — 인화 */
        u.morale=Math.min(100,u.morale+rg);
      }
    }
    /* 유생 다섯 — 인화: 턴마다 진영 전체가 대오를 추스른다 */
    for (const cp of ['A','B']){
      const side=units.filter(u=>u.alive&&u.camp===cp);
      if (!side.length || !side[0].caps['유생']) continue;
      side.forEach(u=>{ const g=Math.min(Math.round(u.max*0.045), u.max-u.troops);
        if(g>0) u.troops+=g; });
      L('hl',`대오를 추스른다 — 진영 병력 4.5% 회복`,side[0].key);
    }
    tickStatus();
    for (const o of units) if (o.alive && o.troops<=0) rout(o,'병력이 다해 무너졌다');
    for (const cp of ['A','B']){
      if (!units.some(u=>u.alive&&u.camp===cp&&u.psv==='moraleHeal')) continue;
      for (const u of units) if (u.alive&&u.camp===cp) u.morale=Math.min(200,u.morale+2);
    }
    for (const u of units){
      if (!u.alive) continue;
      if (u.morale<=30){
        let p=Math.max(K.routMin,(30-u.morale)*K.routSlope);
        if (u.psv==='noRout') p*=0.35;
        if (u.caps['유생']) p*=0.5;         /* 유생 다섯 — 인화 */
        if (Math.random()<p) rout(u,`사기 ${Math.max(0,u.morale).toFixed(0)}에서 끝내 패주했다`);
      }
    }
    const aA=liveOf(units,'A').length, bA=liveOf(units,'B').length;
    if (!aA&&!bA) winner='draw'; else if(!bA) winner='A'; else if(!aA) winner='B';
  }
  if (!winner){
    const at=liveOf(units,'A').reduce((s,u)=>s+u.troops,0);
    const bt=liveOf(units,'B').reduce((s,u)=>s+u.troops,0);
    winner=at>bt?'A':(bt>at?'B':'draw');
    L('div',`해가 기운다 — 잔존 병력 ${Math.round(at).toLocaleString()} 대 ${Math.round(bt).toLocaleString()}`);
  }
  const roster=units.map(u=>({name:u.c.name, tier:u.c.tier, tag:u.c.tag, fac:u.c.fac,
    kind:u.c.kind, line:u.line, side:u.side, camp:u.camp, max:u.max,
    key:u.key, item:u.item, id:u.c.id}));
  /* 수훈갑 —— 병력 피해·사기 피해·이탈·회복을 합산해 으뜸을 고른다 */
  const merit = u => u.dmg + u.mdmg*420 + u.heal*420 + u.kills*3200;
  const mine = units.filter(u=>u.camp==='A');
  const ranked = mine.slice().sort((x,y)=>merit(y)-merit(x))
    .filter(u=>merit(u)>0)
    .map(u=>({name:u.c.name, tier:u.c.tier, tag:u.c.tag, fac:u.c.fac, kind:u.c.kind,
      line:u.line, side:u.side, slot:u.slot, item:u.item, alive:u.alive,
      dmg:Math.round(u.dmg), mdmg:Math.round(u.mdmg), heal:Math.round(u.heal),
      kills:u.kills, merit:Math.round(merit(u)),
      left:Math.max(0,Math.round(u.troops)), max:u.max, morale:Math.round(u.morale)}));
  return {win:winner==='A', draw:winner==='draw', ev, roster, title, aForm, bForm,
          aSyn, bSyn, foe:foeName||'', mvp:ranked[0]||null, ranked:ranked.slice(0,3),
          left:liveOf(units,'A').length, eLeft:liveOf(units,'B').length, turns:turn};
}
const myMorale = ()=>Math.round(Math.min(130, 100 + S.myW*3 - S.myL*4));
function myBattle(eCards, eForm, title, foeName){
  return runBattle(S.board, S.form, myMorale(), S.equip,
                   eCards, eForm, 100, null, title, foeName);
}

/* ═══════════════════════════════════════════════════════════
   8. 진행
   ═══════════════════════════════════════════════════════════ */
const botPvGain=(d,p)=>22+d*4+(p===2?4:0);
/* 봇 등용 소식 —— 실제로 편성 가능한 최고 등급이 올라갔을 때만 알린다.
   누적 PV만 보면 아직 편성하지도 못하는 등급을 예고해 소식과 실전이 어긋난다. */
function botNews(){
  const out=[];
  for (const b of S.bots){
    const top=Math.max(...genBoard(b.pv, b.style).cards.map(k=>C[k].tier));
    if (top<6 || top<=(b.topTier||0)) continue;
    b.topTier=top;
    const pl=(POOLS[b.style][top]||[]).filter(k=>C[k].tier<8);
    if (!pl.length) continue;
    out.push({who:b.name, unit:pickR(pl)});
  }
  return out;
}
let TOASTS=[];
function toast(msg, cls){
  const box=$('#toast'); if(!box) return;
  TOASTS.push({msg,cls});
  box.innerHTML=TOASTS.map(t=>`<div class="tst ${t.cls||''}">${t.msg}</div>`).join('');
  if (typeof setTimeout==='function') setTimeout(()=>{
    TOASTS.shift();
    const b2=$('#toast'); if(b2) b2.innerHTML=TOASTS.map(t=>`<div class="tst ${t.cls||''}">${t.msg}</div>`).join('');
  }, 2800);
}
const phaseIdx = ()=>S.day*3+S.phase;
function advance(){
  S.phase++;
  if (S.phase>2){ S.phase=0; S.day++; }
  S.drawn=false; S.picked=false; S.granted=false; S.questDone=false; S.pvpDone=false;
  S.log=null; PB=null; S.trades=TRADE_PER_PHASE; S.lastDraw=null;
  if (S.day>6){ S.over={win:true,msg:'일주일을 살아남았다'}; S.day=6; render(); return; }
  const it=gainItem();                         /* 페이즈가 넘어갈 때 아이템 1개 */
  /* 유니크는 정해진 아침에만 온다. 왔다는 사실이 묻히지 않게 따로 알린다. */
  if (it && IT[it].grade==='유니크')
    toast(`<b style="color:var(--gold)">${esc(IT[it].name)}</b> 유니크 보급 도착 · ${esc(IT[it].tag)}`,'gain');
  for (const b of S.bots) b.pv+=botPvGain(S.day,S.phase)*b.skill*rnd(.9,1.1);
  const news=botNews();
  news.forEach(n=>{
    S.news.unshift(n);
    toast(`<b>${esc(n.who)}</b>가 <b style="color:${colorOf(n.unit)}">${esc(C[n.unit].name)}</b>을 등용했습니다`,'news');
  });
  S.news=S.news.slice(0,12);
  render();
}
function doQuest(){
  const pv=QPV[S.day][S.phase];
  const eb=genBoard(pv, pickR(['물리','지략','균형']));
  const r=myBattle(autoPlace(eb.cards,eb.form), eb.form, `토벌 · ${QUESTS[S.day][S.phase]}`, QUESTS[S.day][S.phase]);
  r.kind='quest';                              /* 결과 삽화를 고르는 데 쓴다 */
  S.log=r; S.questDone=true; PB={i:0,done:false,timer:null,fresh:true};
  if (r.win){
    S.pendingPicks=S.pendingPicks.concat(QUEST_REWARD[S.day].map(p=>({...p,src:`토벌 · ${QUESTS[S.day][S.phase]}`})));
    const n=QUEST_BASE[S.day];
    for (let i=0;i<n;i++) give(pickR(BASE));
    S.lastSpoil={n, src:`토벌 · ${QUESTS[S.day][S.phase]}`};
  }
  else {
    /* 어느 페이즈든 토벌 실패는 경고로 쌓인다. */
    S.strikes++;
    if (S.strikes>=STRIKE_MAX && S.day>=2)
      S.over={win:false,msg:`${QUESTS[S.day][S.phase]} 실패 — ${STRIKE_MAX}번의 패배로 세력이 멸망했다`};
  }
  for (const b of S.bots){
    if (b.pv < pv*0.95*rnd(.92,1.08)){ b.strikes++; b.pv*=0.94; }
  }
  render(); go('battle');
}
function doPvp(){
  const foe=pickR(S.bots);
  const eb=genBoard(foe.pv, foe.style);
  const r=myBattle(autoPlace(eb.cards,eb.form), eb.form, `대전 · ${foe.name}`, foe.name);
  /* 상대는 봇이다. 진영 머리에 아이디를 걸어 누구와 붙는지 첫 줄에 보이게 한다. */
  r.foeBot={name:foe.name, epi:foe.epi, fac:foe.fac, pv:Math.round(foe.pv)};
  r.kind='pvp';
  S.log=r; S.pvpDone=true; PB={i:0,done:false,timer:null,fresh:true};
  const nb = r.win ? PVP_BASE.win : PVP_BASE.lose;
  for (let i=0;i<nb;i++) give(pickR(BASE));
  S.lastSpoil={n:nb, src:`대전 · ${foe.name}`};
  if (r.win){ S.myW++; foe.l++; S.pendingPicks.push({t:S.day>=3?4:3,n:1,src:`대전 승리 · ${foe.name}`}); }
  else { S.myL++; foe.w++; S.pendingPicks.push({t:S.day>=3?3:2,n:1,src:`대전 패배 · ${foe.name}`}); }
  render(); go('battle');
}

/* ═══ 8인 토너먼트 ═══ */
const ROUNDNM=['8강','4강','결승'];
function initTour(){
  const ps=[{me:1,name:'나',pv:myPV()}]
    .concat(S.bots.map(b=>({me:0,name:b.name,pv:Math.round(b.pv),style:b.style})));
  ps.sort((a,b)=>b.pv-a.pv);
  const seed=[0,7,3,4,1,6,2,5];
  S.tour={round:0, list:seed.map(i=>ps[i]), res:[null,null,null], myMatch:-1, next:null};
  prepRound();
}
function tourBoard(pl){
  if (pl.me) return {cards:S.board, form:S.form, morale:myMorale(), equip:S.equip};
  const eb=genBoard(pl.pv, pl.style||'균형');
  return {cards:autoPlace(eb.cards,eb.form), form:eb.form, morale:100, equip:null};
}
function simMatch(a,b){
  const x=tourBoard(a), y=tourBoard(b);
  return runBattle(x.cards,x.form,x.morale,x.equip,y.cards,y.form,y.morale,y.equip,'').win?a:b;
}
function prepRound(){
  const L=S.tour.list, r=S.tour.round;
  const mi=L.findIndex(p=>p.me);
  S.tour.myMatch = mi>=0 ? Math.floor(mi/2) : -1;
  const ms=[];
  for (let m=0;m<L.length/2;m++){
    const a=L[m*2], b=L[m*2+1];
    ms.push(m===S.tour.myMatch ? {a,b,w:null} : {a,b,w:simMatch(a,b)});
  }
  S.tour.res[r]=ms;
}
const tourRank = ()=> S.tour.round===0?'5~8위':S.tour.round===1?'3~4위':'2위';
function doTour(){
  const r=S.tour.round, ms=S.tour.res[r], m=ms[S.tour.myMatch];
  const me=m.a.me?m.a:m.b, foe=m.a.me?m.b:m.a;
  const y=tourBoard(foe);
  const res=runBattle(S.board,S.form,myMorale(),S.equip,y.cards,y.form,y.morale,y.equip,
                      `${ROUNDNM[r]} · ${foe.name}`, foe.name);
  const fb=S.bots.find(b=>b.name===foe.name);
  if (fb) res.foeBot={name:fb.name, epi:fb.epi, fac:fb.fac, pv:Math.round(foe.pv)};
  res.kind='pvp';                              /* 토너먼트도 세력 간 대전으로 친다 */
  S.log=res; PB={i:0,done:false,timer:null,fresh:true};
  m.w = res.win?me:foe;
  if (!res.win) S.over={win:false,msg:`${ROUNDNM[r]}에서 ${foe.name}에게 패했다 — 최종 ${tourRank()}`};
  else if (r===2) S.over={win:true,msg:`${EUL(foe.name)} 꺾고 천하를 얻었다`};
  else { S.myW++; S.tour.next=ms.map(x=>x.w); }
  render(); go('battle');
}
function tourAdvance(){
  S.tour.list=S.tour.next; S.tour.next=null; S.tour.round++;
  S.log=null; PB=null; prepRound(); render();
}
